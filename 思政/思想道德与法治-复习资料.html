  }).join("");
  document.getElementById("examView").innerHTML =
    `<div class="q-summary"><h2>📋 选择一套预测试卷</h2>
    <p style="color:var(--muted);font-size:13px;margin-top:6px">建议闭卷作答：选择题点击选项即时判分，主观题先自答再对照参考答案。</p>
    <div class="exam-pick" style="margin-top:14px">${cards}</div></div>`;
}
function startPaper(i){ EXAM.pi = i; EXAM.answers = {}; EXAM.multiLocked = {}; EXAM.done = false; renderPaper(); }
function qKey(si, qi){ return si+"-"+qi; }
function isLetterFillQ(q){
  // 字母填空题：答案为单个字母，或「字母 + 括号解释」（如 B、A（boost））
  // 不匹配完整单词/短语填空（如 responsibility）
  return !!(q && q.type === "fill" && /^[A-Z](?:\s*[（(][^）)]*[）)])?$/i.test(String(q.answer||"").trim()));
}
function answerLetter(q){
  const m = String(q.answer||"").trim().match(/^[A-Za-z]/);
  return m ? m[0].toUpperCase() : "";
}
function isMultiQ(q){
  // 多选题：答案为 2 个及以上纯字母组合（如 ABCDE / BD），type 建议标注 multi
  return /^[A-Za-z]{2,}$/.test(String(q.answer||"").trim());
}
function answerLetters(q){
  return String(q.answer||"").trim().toUpperCase().split("").sort();
}
function renderStimulus(stim){
  const list = Array.isArray(stim) ? stim : [stim];
  return list.filter(s=>s && typeof s==="object").map(s=>{
    const paras = (s.paragraphs && s.paragraphs.length) ? s.paragraphs : (s.text ? [s.text] : []);
    return `<div class="material-box">` +
      (s.title ? `<h4>${esc(s.title)}</h4>` : "") +
      (s.note ? `<div class="note">${esc(s.note)}</div>` : "") +
      paras.map(p=>`<p>${esc(p)}</p>`).join("") +
      (s.source ? `<div class="src">📎 来源：${esc(s.source)}</div>` : "") +
      `</div>`;
  }).join("");
}
function stimKey(s){
  if (!s || typeof s !== "object") return null;
  return (s.title||"") + "\\u0001" + (s.text||"") + "\\u0001" + (s.paragraphs||[]).join("\\u0002");
}
function renderPaper(){
  const p = EXAM.papers[EXAM.pi];
  let html = `<div class="paper-head">
    <div class="course">《${esc(courseName)}》</div>
    <div class="name">${esc(p.name||"")}</div>
    <div class="info">考试时长 ${p.duration||120} 分钟 ｜ 满分 ${p.total_score||100} 分 ｜ 在线作答</div>
  </div>`;
  let qnum = 0;
  (p.sections||[]).forEach((sec,si)=>{
    html += `<div class="sec-title">${esc(sec.type||"")}</div>`;
    if (sec.instruction) html += `<div class="sec-ins">${esc(sec.instruction)}</div>`;
    let lastStimKey = sec.stimulus ? stimKey(sec.stimulus) : null;
    if (sec.stimulus) html += renderStimulus(sec.stimulus);
    (sec.questions||[]).forEach((q,qi)=>{
      qnum++;
      const key = qKey(si,qi);
      const isChoice = !!(q.options && q.options.length);
      const isLetterFill = !isChoice && isLetterFillQ(q);
      const answered = EXAM.answers[key];
      const typeTag = q.type==="listening" ? "<span class=\"badge dim\">听力</span> " : (q.type==="reading" ? "<span class='badge dim'>阅读</span> " : "");
      html += `<div class="q-item" id="q-${si}-${qi}">
        <div class="stem">${typeTag}${qnum}. ${esc(q.q)} <span class="score-tag">（${q.score||""} 分）</span></div>`;
      if (q.stimulus && stimKey(q.stimulus) !== lastStimKey) {
        html += renderStimulus(q.stimulus);
        lastStimKey = stimKey(q.stimulus);
      }
      if (isChoice){
        const isMulti = isMultiQ(q);
        const sel = Array.isArray(answered) ? answered : [];
        const locked = isMulti ? !!EXAM.multiLocked[key] : (answered != null);
        html += `<div class="opts">` + q.options.map((opt,oi)=>{
          const letter = opt.trim()[0];
          let cls = "opt";
          if (isMulti){
            if (sel.indexOf(letter) >= 0) cls += " selected";
            if (locked || EXAM.done){
              cls += " disabled";
              if (answerLetters(q).indexOf(letter.toUpperCase()) >= 0) cls += " right";
            }
            const handler = `toggleMulti(${si},${qi},'${letter}')`;
            return `<button class="${cls}" onclick="${handler}">${esc(opt)}</button>`;
          }
          if (answered != null){
            cls += " disabled";
            if (letter.toUpperCase() === answerLetter(q)) cls += " right";
            else if (letter === answered) cls += " wrong";
          }
          return `<button class="${cls}" onclick="answerChoice(${si},${qi},'${letter}')">${esc(opt)}</button>`;
        }).join("") + `</div>`;
        if (isMulti){
          if (!locked && !EXAM.done){
            html += `<div class="q-btns" style="margin-top:10px">
              <button class="btn btn-primary" onclick="commitMulti(${si},${qi})">✅ 确认本题（已选 ${sel.length} 项，多选）</button></div>`;
          }
          if (locked || EXAM.done){
            const right = sel.slice().sort().join("") === answerLetters(q).join("");
            html += `<div class="ans-note ${right?"right":"wrong"}">
              ${right?"✔ 回答正确":"✘ 回答错误，正确答案："+esc(q.answer)}${q.analysis?"<br>解析："+esc(q.analysis):""}</div>`;
          }
        } else if (answered != null){
          const right = (String(answered).toUpperCase() === answerLetter(q));
          html += `<div class="ans-note ${right?"right":"wrong"}">
            ${right?"✔ 回答正确":"✘ 回答错误，正确答案："+esc(q.answer)}${q.analysis?"<br>解析："+esc(q.analysis):""}</div>`;
        }
      } else if (isLetterFill){
        const val = (answered != null && answered !== true) ? answered : "";
        html += `<div class="opts" style="margin-top:10px">
          <input type="text" maxlength="1" placeholder="输入答案字母（如 B）" value="${esc(val)}"
            oninput="answerFillInput(${si},${qi},this.value)" onchange="answerFillCommit(${si},${qi})"
            ${EXAM.done?"disabled":""}
            style="padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:var(--card);color:var(--text);width:220px"></div>`;
        if (answered != null && answered !== true && answered !== ""){
          const right = String(answered).toUpperCase() === answerLetter(q);
          html += `<div class="ans-note ${right?"right":"wrong"}">
            ${right?"✔ 回答正确":"✘ 回答错误，正确答案："+esc(q.answer)}${q.analysis?"<br>解析："+esc(q.analysis):""}</div>`;
        }
      } else {
        const show = answered === true;
        html += `<div class="q-btns" style="margin-top:10px">
          <button class="btn ${show?"btn-ghost":"btn-primary"}" onclick="toggleEssay(${si},${qi})">${show?"🙈 收起参考答案":"👁️ 查看参考答案"}</button></div>`;
        if (show){
          html += `<div class="q-answer"><p>${esc(q.answer||"").replace(/\n/g,"<br>")}</p>
            ${q.analysis?`<div class="ex">解析：${esc(q.analysis)}</div>`:""}</div>`;
        }
      }
      html += `</div>`;
    });
  });
  const totalQ = (p.sections||[]).reduce((a,s)=>a+(s.questions||[]).length,0);
  const answeredN = Object.keys(EXAM.answers).filter(k=>{
    const v = EXAM.answers[k];
    if (Array.isArray(v)) return v.length > 0 && !!EXAM.multiLocked[k];
    return v != null && v !== "" && v !== true;
  }).length;
  html += `<div class="exam-float">
    <button class="btn btn-primary" onclick="submitPaper()">✅ 交卷查看得分（已答 ${answeredN}/${totalQ}）</button>
    <button class="btn btn-ghost" onclick="openExams()">↩ 换一套卷</button>
  </div>`;
  document.getElementById("examView").innerHTML = html;
}
function answerChoice(si, qi, letter){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  if (EXAM.answers[key] != null) return;
  EXAM.answers[key] = letter;
  renderPaper();
}
function toggleMulti(si, qi, letter){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  if (EXAM.multiLocked[key]) return;
  let sel = Array.isArray(EXAM.answers[key]) ? EXAM.answers[key].slice() : [];
  const i = sel.indexOf(letter);
  if (i >= 0) sel.splice(i, 1); else sel.push(letter);
  EXAM.answers[key] = sel;
  renderPaper();
}
function commitMulti(si, qi){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  const sel = Array.isArray(EXAM.answers[key]) ? EXAM.answers[key] : [];
  if (!sel.length) return;
  EXAM.multiLocked[key] = true;
  renderPaper();
}
function answerFillInput(si, qi, val){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  EXAM.answers[key] = String(val).trim().toUpperCase() || null;
}
function answerFillCommit(si, qi){ renderPaper(); }
function toggleEssay(si, qi){
  const key = qKey(si,qi);
  EXAM.answers[key] = EXAM.answers[key] === true ? null : true;
  renderPaper();
}
function submitPaper(){
  const p = EXAM.papers[EXAM.pi];
  let qnum = 0, objTotal = 0, objRight = 0, objScore = 0, objFull = 0, subjFull = 0;
  const wrongs = [], unanswereds = [];
  (p.sections||[]).forEach((sec,si)=>{
    (sec.questions||[]).forEach((q,qi)=>{
      qnum++;
      const key = qKey(si,qi);
      const isChoice = !!(q.options && q.options.length);
      const isMulti = isChoice && isMultiQ(q);
      const isLetterFill = !isChoice && isLetterFillQ(q);
      const isObjective = isChoice || isLetterFill;
      const a = EXAM.answers[key];
      if (isObjective){
        objTotal++; objFull += (q.score||0);
        if (isMulti){
          const sel = Array.isArray(a) ? a : [];
          if (!sel.length || !EXAM.multiLocked[key]){ unanswereds.push({n:qnum,q,si,qi}); }
          else if (sel.slice().sort().join("") === answerLetters(q).join("")){ objRight++; objScore += (q.score||0); }
          else wrongs.push({n:qnum,q,si,qi});
        } else if (a == null || a === "" || a === true){ unanswereds.push({n:qnum,q,si,qi}); }
        else if (String(a).toUpperCase() === answerLetter(q)){ objRight++; objScore += (q.score||0); }
        else wrongs.push({n:qnum,q,si,qi});
      } else {
        subjFull += (q.score||0);
        if (a !== true){ unanswereds.push({n:qnum,q,si,qi}); }
      }
    });
  });
  EXAM.done = true;
  const pct = objFull ? Math.round(objScore/objFull*100) : 0;
  let html = `<div class="exam-score">
    <h2 style="color:var(--primary-dark);font-size:20px">✅ 交卷成功（${esc(p.name||"")}）</h2>
    <div style="margin:10px 0"><b class="big">${objScore}</b><span style="color:var(--muted)"> / ${objFull} 分（客观题自动判分）</span></div>
    <div class="subs">
      <div><b>${objRight}/${objTotal}</b>客观题正确</div>
      <div><b>${pct}%</b>客观题得分率</div>
      <div><b>${unanswereds.length}</b>未作答/未查看</div>
    </div>
    ${subjFull?`<p style="margin-top:12px;color:var(--muted);font-size:12.5px">主观题（写作/翻译/简答）共 ${subjFull} 分，需自行对照参考答案评分，不计入自动判分。</p>`:""}`;
  const items = (arr, title, styleCls) => arr.length ? `
    <h3 style="font-size:14px;margin-top:16px;text-align:left">${title}</h3>
    <div class="${styleCls}">${arr.map(w=>
      `<a href="javascript:void(0)" onclick="jumpToKp('${escJs(w.q.kp_id||"")}');scrollToQ(${w.si},${w.qi})">
        第${w.n}题：${esc(String(w.q.q).slice(0,42))}…${w.q.answer?("｜答案："+esc(w.q.answer)):""}</a>`).join("")}</div>` : "";
  html += items(wrongs, "❌ 答错的题目（点击回看解析）", "wrong-list");
  html += items(unanswereds, "⏳ 未作答/未查看答案的题目", "wrong-list");
  html += `<div class="q-btns" style="justify-content:center">
    <button class="btn btn-primary" onclick="startPaper(${EXAM.pi})">🔄 重做本卷</button>
    <button class="btn btn-ghost" onclick="openExams()">↩ 换一套卷</button>
    <button class="btn btn-ghost" onclick="switchView('content')">📖 回去复习</button>
  </div></div>`;
  document.getElementById("examView").innerHTML = html;
}
function scrollToQ(si, qi){
  switchView("exam");
  setTimeout(()=>{ const el = document.getElementById("q-"+si+"-"+qi);
    if (el) el.scrollIntoView({behavior:"smooth",block:"center"}); }, 80);
}

/* ================= 视图切换 ================= */
function switchView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.view===v));
  document.getElementById("contentWrap").classList.toggle("hidden", v!=="content");
  document.getElementById("graphView").classList.toggle("hidden", v!=="graph");
  document.getElementById("quizView").classList.toggle("hidden", v!=="quiz");
  document.getElementById("examView").classList.toggle("hidden", v!=="exam");
  document.getElementById("filterChips").style.display = v==="content" ? "flex" : "none";
  if (v==="graph"){
    if (!G.inited) buildGraph();
    G.alpha = Math.max(G.alpha, 0.25); startSim();
  }
  if (v==="quiz") openQuiz();
  if (v==="exam") openExams();
}

loadTheme();
applyTheme();
buildContent();
</script>
