<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《马克思主义基本原理》期末复习资料</title>
<style>
:root{
  --primary:#2E74B5; --primary-dark:#1F4E79; --bg:#F4F8FC; --card:#FFFFFF;
  --text:#2C3E50; --muted:#8496A9; --line:#E3ECF5; --glass:rgba(255,255,255,.86);
  --s5:#E74C3C; --s4:#E67E22; --s3:#D9B40F; --s2:#3498DB; --s1:#95A5A6;
  --gcanvas:#EDF2F9; --gdots:#D7E1EF; --glabel:#2C3E50; --gpanel:rgba(255,255,255,.9);
  --gpanel-text:#4A5B6E; --shadow:0 4px 18px rgba(31,78,121,.08);
}
html[data-theme="dark"]{
  --primary:#5FA8E8; --primary-dark:#7FB3E8; --bg:#141924; --card:#1E2634;
  --text:#D5DEE8; --muted:#7E8CA0; --line:#2A3444; --glass:rgba(23,29,40,.86);
  --s5:#FF7B6B; --s4:#F59E56; --s3:#E8CE5A; --s2:#6FB4F0; --s1:#9FB0C4;
  --gcanvas:#0E131B; --gdots:#1C2531; --glabel:#C7D3E3; --gpanel:rgba(16,21,28,.88);
  --gpanel-text:#C7D3E3; --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;color:var(--primary-dark);white-space:nowrap}
header .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:5px 15px;font-size:13px;cursor:pointer;color:var(--primary-dark);transition:.15s}
.tab.active,.tab:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--text)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* ---------- 主题控件 ---------- */
.theme-ctl{display:flex;align-items:center;gap:8px}
.right-ctl{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;line-height:1;color:var(--text)}
.tbtn:hover{border-color:var(--primary)}
#themePanel{position:absolute;top:56px;right:16px;z-index:80;background:var(--gpanel);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:14px;padding:16px;width:250px;box-shadow:var(--shadow);display:none}
#themePanel.open{display:block}
#themePanel h4{font-size:13px;color:var(--primary-dark);margin-bottom:12px}
#themePanel .row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:12px;color:var(--gpanel-text)}
#themePanel input[type=range]{flex:1;accent-color:var(--primary)}
#themePanel .val{width:38px;text-align:right;color:var(--muted)}
#themePanel .reset{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:18px;padding:6px;font-size:12px;cursor:pointer}
#eyeCareBtn{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);
  border-radius:18px;padding:8px;font-size:12.5px;cursor:pointer;margin-bottom:4px;transition:.15s}
#eyeCareBtn.on{background:rgba(230,126,34,.2);border-color:var(--s4);color:#B65A17;font-weight:bold}
#eyeCareBtn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#B0BEC5;margin-right:6px;vertical-align:1px}
#eyeCareBtn.on .dot{background:#E67E22;box-shadow:0 0 6px rgba(230,126,34,.8)}
/* ---------- 亮度/色调覆盖层 ---------- */
#dimLayer,#tintLayer{position:fixed;inset:0;pointer-events:none;z-index:200}
/* ---------- 布局 ---------- */
.wrap{display:flex;max-width:1280px;margin:0 auto;gap:18px;padding:18px}
nav.side{width:225px;flex:none;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
nav.side .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
nav.side h3{font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:normal}
nav.side a{display:block;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--text);text-decoration:none;border-left:2.5px solid transparent}
nav.side a:hover{background:rgba(95,168,232,.12);border-left-color:var(--primary)}
main{flex:1;min-width:0}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;scroll-margin-top:74px}
.overview{background:linear-gradient(135deg,rgba(95,168,232,.12),var(--card))}
.overview p{font-size:13.5px;line-height:1.8;margin:4px 0}
h2.chapter{font-size:18px;color:var(--primary-dark);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch-overview{font-size:12.5px;color:var(--muted);margin-top:4px}
.kp{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:var(--card)}
.kp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kp-head .num{font-size:13.5px;font-weight:bold;color:var(--primary-dark)}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;color:#fff}
.dim{background:var(--primary);opacity:.9}
.hits{background:rgba(39,117,75,.14);color:#27754B;font-size:11px;padding:2px 9px;border-radius:10px}
html[data-theme="dark"] .hits{color:#7FC79B}
.kp-body p{font-size:13.5px;line-height:1.75;margin:5px 0}
.kp-body .ex{font-size:12.5px;color:#B03A2E;background:rgba(231,76,60,.08);border-left:3px solid var(--s5);padding:5px 10px;border-radius:6px;margin-top:6px}
.hidden{display:none!important}
.kw{display:flex;gap:10px;flex-wrap:wrap}
.kw span{background:rgba(95,168,232,.14);color:var(--primary-dark);font-size:12.5px;padding:6px 12px;border-radius:8px}
.chart .row{display:flex;align-items:center;gap:10px;margin:7px 0}
.chart .name{width:220px;font-size:12.5px;text-align:right;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .bar{height:16px;border-radius:8px;background:var(--primary);min-width:4px}
.chart .val{font-size:12px;color:var(--muted)}
/* ---------- 知识图谱 ---------- */
#graphView{position:relative;height:calc(100vh - 62px);margin:0 auto;max-width:1280px;padding:0 18px}
#graphView .tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;
  background:var(--gpanel);color:var(--gpanel-text);font-size:12px;padding:6px 16px;border-radius:16px;backdrop-filter:blur(6px);border:1px solid var(--line)}
#graphView .legend{position:absolute;left:30px;top:52px;z-index:5;background:var(--gpanel);
  color:var(--gpanel-text);font-size:11.5px;padding:10px 14px;border-radius:10px;line-height:1.9;backdrop-filter:blur(6px);border:1px solid var(--line)}
#graphView .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#graphView .legend .sw{display:inline-block;width:14px;border-top:2px dashed #7E8CA0;margin-right:6px;vertical-align:3px}
#gtools{position:absolute;right:30px;top:52px;z-index:5;display:flex;gap:6px}
#gtools button{border:1px solid var(--line);background:var(--gpanel);color:var(--gpanel-text);font-size:12px;
  padding:6px 12px;border-radius:16px;cursor:pointer;backdrop-filter:blur(6px)}
#gtools button:hover{border-color:var(--primary);color:var(--primary-dark)}
#gsvgBox{width:100%;height:100%;background:var(--gcanvas);border-radius:14px;cursor:grab;
  position:relative;overflow:hidden;border:1px solid var(--line);
  background-image:radial-gradient(var(--gdots) 1.2px,transparent 1.2px);background-size:24px 24px;transition:background .25s}
#gsvgBox:active{cursor:grabbing}
#gsvg{width:100%;height:100%;display:block}
#gsvg text{pointer-events:none;user-select:none;paint-order:stroke;stroke:var(--gcanvas);stroke-width:4.5px;stroke-linejoin:round;transition:stroke .25s}
.gnode{cursor:pointer;transition:opacity .18s}
#glinks line{transition:opacity .18s,stroke-width .18s}
/* ---------- 自测版 ---------- */
#quizView{max-width:760px;margin:0 auto;padding:18px}
.q-meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.quiz-awrap{position:relative;margin-top:10px}
.quiz-body{filter:blur(7px);user-select:none;pointer-events:none;transition:filter .3s}
.q-card.revealed .quiz-body{filter:none;user-select:auto;pointer-events:auto}
.quiz-mask{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(127,131,166,.10);border-radius:8px;transition:background .25s}
.quiz-mask:hover{background:rgba(46,116,181,.12)}
.quiz-mask span{background:var(--primary);color:#fff;font-size:13px;padding:8px 22px;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.q-card.revealed .quiz-mask{display:none}
.q-meta b{color:var(--primary-dark)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.q-title{font-size:19px;font-weight:bold;color:var(--primary-dark);line-height:1.6}
.q-hint{font-size:13px;color:var(--muted);margin-top:10px}
.q-answer{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.q-answer p{font-size:14px;line-height:1.8;margin:5px 0}
.q-answer .ex{font-size:12.5px;color:#B03A2E;background:rgba(231,76,60,.08);border-left:3px solid var(--s5);padding:5px 10px;border-radius:6px;margin-top:8px}
.q-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:none;border-radius:20px;padding:9px 26px;font-size:14px;cursor:pointer;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ok{background:rgba(39,117,75,.12);color:#27754B;border:1px solid rgba(39,117,75,.3)}
.btn-again{background:rgba(230,126,34,.14);color:#B65A17;border:1px solid rgba(230,126,34,.35)}
.btn-ghost{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.q-progress{height:6px;background:rgba(95,168,232,.18);border-radius:4px;overflow:hidden;margin-bottom:16px}
.q-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#5FA8E8);border-radius:4px;transition:width .3s}
.q-summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.q-summary h2{color:var(--primary-dark);font-size:20px;margin-bottom:10px}
.q-summary .stat{display:flex;gap:14px;margin:14px 0}
.q-summary .stat div{flex:1;background:var(--bg);border-radius:12px;padding:14px;text-align:center}
.q-summary .stat b{font-size:22px;display:block}
.q-summary .stat span{font-size:12px;color:var(--muted)}
.q-again-list{margin-top:12px}
.q-again-list a{display:block;font-size:13.5px;color:var(--text);padding:6px 10px;border-radius:8px;text-decoration:none;border-left:2.5px solid var(--s4);background:rgba(230,126,34,.08);margin-bottom:6px}
/* ---------- 预测试卷 ---------- */
#examView{max-width:860px;margin:0 auto;padding:18px}
.exam-pick{display:flex;gap:16px;flex-wrap:wrap}
.exam-card{flex:1;min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}
.exam-card:hover{border-color:var(--primary);transform:translateY(-3px)}
.exam-card h3{color:var(--primary-dark);font-size:18px}
.exam-card .info{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.9}
.paper-head{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.paper-head .course{font-size:15px;color:var(--muted)}
.paper-head .name{font-size:22px;font-weight:bold;color:var(--primary-dark);margin:6px 0}
.paper-head .info{font-size:12.5px;color:var(--muted)}
.sec-title{font-size:14.5px;font-weight:bold;color:var(--primary-dark);margin:20px 0 4px}
.sec-ins{font-size:11.5px;color:var(--muted);margin-bottom:8px}
/* ---------- 题面材料（阅读/听力/翻译/写作材料） ---------- */
.material-box{background:rgba(87,168,232,.08);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;padding:14px 16px;margin:10px 0;line-height:1.9}
.material-box h4{font-size:13px;color:var(--primary-dark);margin-bottom:6px}
.material-box p{font-size:13px;color:var(--text);margin:5px 0}
.material-box .note{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:4px}
.material-box .src{font-size:11px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.q-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:10px}
.q-item .stem{font-size:13.8px;line-height:1.7;font-weight:bold}
.q-item .score-tag{font-size:11px;color:var(--muted)}
.opts{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;text-align:left;color:var(--text);transition:.13s}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:rgba(95,168,232,.12)}
.opt.right{border-color:#27754B;background:rgba(39,117,75,.14);color:#27754B;font-weight:bold}
.opt.wrong{border-color:#C0392B;background:rgba(192,57,43,.1);color:#C0392B}
.opt.disabled{cursor:default;opacity:.75}
.opt.selected{border-color:var(--primary);background:rgba(95,168,232,.16);font-weight:bold}
.opt.selected.disabled{opacity:.92}
.ans-note{margin-top:10px;font-size:12.5px;line-height:1.7;border-radius:8px;padding:9px 12px}
.ans-note.right{background:rgba(39,117,75,.1);color:#27754B}
.ans-note.wrong{background:rgba(192,57,43,.08);color:#B03A2E}
.exam-float{position:sticky;bottom:14px;display:flex;gap:10px;justify-content:center;margin-top:18px;z-index:10}
.exam-score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.exam-score b.big{font-size:34px;color:var(--primary-dark)}
.exam-score .subs{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.exam-score .subs div{background:var(--bg);border-radius:12px;padding:12px 20px;font-size:13px}
.exam-score .subs b{display:block;font-size:20px;color:var(--primary-dark)}
.wrong-list{margin-top:12px;text-align:left}
.wrong-list a{display:block;font-size:13px;color:var(--text);padding:7px 10px;border-radius:8px;text-decoration:none;border-left:2.5px solid var(--s5);background:rgba(231,76,60,.07);margin-bottom:6px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:16px}
@media print{header,nav.side,.tabs,.chips,#graphView,#quizView,#examView,.theme-ctl{display:none}.wrap{padding:0}}
@media (max-width:900px){nav.side{display:none}header .sub{display:none}}
</style>
</head>

<div id="dimLayer"></div><div id="tintLayer"></div>

<header>
  <h1>《马克思主义基本原理》期末复习资料</h1><div class="sub">课程：马克思主义基本原理 ｜ 范围：绪论 + 第1-7章（哲学约70%、政治经济学约20%、绪论与科社约10%）｜ 生成日期：2026-10-28</div>
  <div class="tabs">
    <button class="tab active" data-view="content" onclick="switchView('content')">📖 复习资料版</button>
    <button class="tab" data-view="graph" onclick="switchView('graph')">🕸️ 知识图谱</button>
    <button class="tab" data-view="quiz" onclick="switchView('quiz')">📝 自测版</button>
    <button class="tab" data-view="exam" onclick="switchView('exam')">📋 预测试卷</button>
  </div>
  <div class="right-ctl">
  <div class="chips" id="filterChips">
    <button class="chip on" data-min="0" onclick="filterStars(this)">全部</button>
    <button class="chip" data-min="5" onclick="filterStars(this)">仅 5★</button>
    <button class="chip" data-min="4" onclick="filterStars(this)">4★ 及以上</button>
    <button class="chip" data-min="3" onclick="filterStars(this)">3★ 及以上</button>
  </div>
  <div class="theme-ctl">
    <button class="tbtn" id="btnThemeMode" onclick="toggleThemeMode()" title="日间 / 夜间模式">🌙</button>
    <button class="tbtn" onclick="toggleThemePanel()" title="显示调节与护眼">⚙️</button>
  </div>
  </div>
  <div id="themePanel">
    <h4>🎨 显示调节</h4>
    <button id="eyeCareBtn" onclick="toggleEyeCare()"><span class="dot"></span>👁 护眼模式（暖光护眼）</button>
    <div class="row"><span style="width:34px">亮度</span>
      <input type="range" id="rgBright" min="70" max="115" value="100" oninput="onThemeSlider('b')">
      <span class="val" id="vBright">100%</span></div>
    <div class="row"><span style="width:34px">色调</span>
      <input type="range" id="rgTint" min="-50" max="50" value="0" oninput="onThemeSlider('t')">
      <span class="val" id="vTint">中性</span></div>
    <button class="reset" onclick="resetTheme()">恢复默认</button>
  </div>
</header>

<div class="wrap" id="contentWrap">
  <nav class="side"><div class="box">
    <h3>📑 大纲导航</h3><div id="outline"></div>
  </div></nav>
  <main id="contentView"></main>
</div>

<div id="graphView" class="hidden">
  <div class="tip">🖱️ 滚轮缩放 ｜ 拖拽平移 ｜ 拖动节点重排 ｜ 悬停高亮关联 ｜ 点击知识点跳转</div>
  <div class="legend" id="glegend"></div>
  <div id="gtools">
    <button onclick="gRelayout()">🔄 重新布局</button>
    <button onclick="gFit()">🔎 适配视图</button>
  </div>

</div>

<div id="quizView" class="hidden"></div>
<div id="examView" class="hidden"></div>

大变革，使社会主义从空想变为科学。列宁称唯物史观为「科学思想中最大的成果」。", "马克思主义在实践中不断发展，与时俱进是马克思主义最重要的理论品质。"], "examples": ["高频填空/选择：德国古典哲学是马克思主义哲学的直接理论来源；两大发现是唯物史观和剩余价值学说。"], "stats": {"hits": 321, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c0-k3", "title": "0.3 马克思主义的鲜明特征", "importance": 4, "dimension": "记忆/理解", "match_terms": ["科学性", "革命性", "实践性", "人民性", "与时俱进", "理论品质"], "content": ["马克思主义具有强大生命力的根源在于：它是以实践为基础的科学性和革命性的统一。这是马克思主义最基本的特征之一。", "辩证唯物主义与历史唯物主义是马克思主义最根本的世界观和方法论；鲜明的政治立场——致力于实现以劳动人民为主体的最广大人民的根本利益；最重要的理论品质——与时俱进；最崇高的社会理想——实现共产主义。", "马克思主义理论最根本的本质属性是科学性；马克思主义具有阶级性（无产阶级的意识形态），但阶级性并不排斥科学性。"], "examples": ["判断题高频：「马克思主义具有阶级性，所以是不科学的」——错误；「马克思主义是 19 世纪的产物，现在已过时」——错误，因其与时俱进的理论品质而保持生命力。"], "stats": {"hits": 61, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}]}, {"id": "c1", "title": "第一章 世界的物质性及其发展规律（唯物论与辩证法）", "overview": "全课程分值最高的哲学核心章，涵盖唯物论、辩证法两大板块，选择、简答、材料、论述全覆盖。", "importance": 5, "knowledge_points": [{"id": "c1-k1", "title": "1.1 哲学基本问题与哲学基本派别", "importance": 5, "dimension": "记忆/理解", "match_terms": ["哲学基本问题", "思维和存在", "唯物主义", "唯心主义", "可知论", "不可知论", "辩证法", "形而上学"], "content": ["哲学是理论化、系统化的世界观和方法论。恩格斯第一次明确提出：思维和存在的关系问题是哲学的基本问题。", "哲学基本问题包括两方面内容：第一方面是思维和存在、物质和意识何者为第一性（谁是世界的本原）的问题，据此划分为唯物主义和唯心主义两大基本派别；第二方面是思维能否认识存在（有无同一性）的问题，据此划分为可知论和不可知论。", "唯物主义把世界本原归结为物质，主张物质第一性、意识第二性；经历了古代朴素唯物主义（把世界归结为火、水、气等具体物质形态）、近代形而上学唯物主义、辩证唯物主义和历史唯物主义三种历史形态。唯心主义把世界本原归结为精神，分为主观唯心主义（人的主观精神是本原，如慧能「仁者心动」、孟子「万物皆备于我」）和客观唯心主义（某种客观精神如理念、绝对观念、数是本原，如毕达哥拉斯「万物皆数」、黑格尔「绝对观念」）。", "围绕世界是怎样存在的问题，形成辩证法与形而上学两种发展观：辩证法用联系、发展、全面的观点看世界，承认事物内部矛盾；形而上学用孤立、静止、片面的观点看世界，否认内部矛盾。是否承认对立统一（矛盾）是二者斗争的焦点和根本分歧。", "历史观的基本问题是社会存在与社会意识的关系问题，据此划分为唯物史观与唯心史观。"], "examples": ["真题反复考：慧能「不是风动，不是幡动，仁者心动」属唯心主义运动观；「白马非马」割裂了普遍性与特殊性的关系；泰勒斯「万物由水产生」属朴素唯物主义；毕达哥拉斯「万物皆数」属客观唯心主义。"], "stats": {"hits": 623, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c1-k2", "title": "1.2 物质观与意识观", "importance": 5, "dimension": "记忆/理解", "match_terms": ["客观实在性", "物质范畴", "人脑的机能", "主观映象", "意识的能动作用", "人工智能"], "content": ["列宁的物质定义：「物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，它不依赖于我们的感觉而存在，为我们的感觉所复写、摄影、反映。」物质的唯一特性是客观实在性。", "列宁物质定义的理论意义：坚持了物质的客观实在性原则，坚持了唯物主义一元论，同唯心主义一元论和二元论划清了界限；坚持能动的反映论和可知论，批判了不可知论；体现了唯物论和辩证法的统一；体现了唯物主义自然观与唯物主义历史观的统一，为彻底的唯物主义奠定了理论基础。", "意识是物质世界长期发展的产物，是人脑的机能和属性，是客观世界的主观映象。意识在内容上是客观的，在形式上是主观的；意识起源上经历无机物的反应特性—低等生物的刺激感应—动物的感觉和心理—人类意识的演化，生产劳动在从动物心理到人类意识的转化中起决定作用。", "意识的能动作用（能动地认识世界和改造世界的能力）主要表现为：意识活动具有目的性和计划性；意识活动具有创造性；意识具有指导实践改造客观世界的作用；意识具有指导、控制人的行为和生理活动的作用。", "「人的意识不仅反映客观世界，而且创造客观世界」（列宁）是对意识能动作用的正确揭示。但意识不能代替人脑、不能脱离物质独立存在——人工智能可以模拟人脑的部分功能，但不能代替人类思维。"], "examples": ["判断题高频：「意识是客观存在的主观映象」指形式主观、内容客观；「只有正确反映客观事物的意识才具有能动作用」——错误，错误意识也有能动作用（阻碍作用）。"], "stats": {"hits": 32, "files_hit": 3, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c1-k3", "title": "1.3 运动观与时空观", "importance": 4, "dimension": "记忆/理解", "match_terms": ["运动", "静止", "根本属性", "时间", "空间", "一维性", "三维性"], "content": ["运动是物质的存在方式和根本属性；物质是运动的承担者和主体。设想没有物质的运动是唯心主义观点，设想不运动的物质是形而上学观点。", "运动是绝对的、无条件的；静止是相对的、有条件的，是运动的特殊状态——空间位置未变（相对于特定参照系）和根本性质未变两种情形。「人不能两次踏进同一条河流」是辩证法（承认绝对运动中有相对静止），「人一次也不能踏进同一条河流」是诡辩论（割裂绝对运动与相对静止）。", "时间和空间是物质运动的存在形式：时间是物质运动的持续性、顺序性，特点是一维性（不可逆性）；空间是物质运动的广延性、伸张性，特点是三维性。", "物质运动与时间空间不可分离：离开时空的物质运动和离开物质运动的时空都不存在，设想超时空的存在导致唯心主义，设想无物质的时空是形而上学观点。"], "examples": ["填空高频：时间的特性是一维性、不可逆性，空间的特性是三维性。判断题：「静止是运动的特殊状态」为正确。"], "stats": {"hits": 556, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c1-k4", "title": "1.4 世界的物质统一性与实践", "importance": 5, "dimension": "理解/分析", "match_terms": ["物质统一性", "实践", "直接现实性", "社会生活在本质上是实践的", "客观规律"], "content": ["世界的真正统一性在于它的物质性（恩格斯）。世界统一于物质，而不是统一于存在（折中主义）或精神（唯心主义）。自然界是物质的，人类社会本质上也是物质的——人类社会依赖于自然界、谋取物质生活资料的实践活动是物质力量改造物质力量的活动、物质资料生产方式是社会存在和发展的基础。", "世界物质统一性原理的意义：它是马克思主义哲学的基石，是彻底的科学唯物主义一元论的理论起点；是反对二元论、宗教神学和唯心主义的锐利武器；是一切从实际出发、实事求是的思想路线的根本理论基础。", "实践是人类能动地改造客观世界的物质活动，具有物质性（直接现实性）、自觉能动性、社会历史性三个基本特征。基本形式包括物质生产实践、社会政治实践和科学文化实践。", "「全部社会生活在本质上是实践的」：实践是自然界与人类社会分化与统一的前提和基础；实践是社会关系形成的基础、形成了社会生活的基本领域、构成了社会发展的动力。", "规律是事物运动发展中本质的、必然的、稳定的联系，客观性是规律的根本特点；人们可以认识、利用规律，但不能创造、消灭规律。"], "examples": ["材料题常考：用世界物质统一性原理评析朴素唯物主义（泰勒斯之水、王充之气）与客观唯心主义（毕达哥拉斯之数）的对立；用「社会生活在本质上是实践的」分析社会实践的意义。"], "stats": {"hits": 500, "files_hit": 5, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c1-k5", "title": "1.5 主观能动性与客观规律性的统一", "importance": 4, "dimension": "理解/应用", "match_terms": ["主观能动性", "客观规律性", "实事求是", "从实际出发"], "content": ["尊重客观规律是正确发挥主观能动性的前提；充分发挥主观能动性是认识和利用客观规律的必要条件。二者辩证统一，把唯物论与辩证法有机结合起来。", "正确发挥主观能动性的途径和条件：从实际出发，努力认识和把握事物的发展规律；实践是发挥人的主观能动性的基本途径；主观能动性的发挥还依赖一定的物质条件和物质手段。", "社会历史趋向（历史决定论）与主体选择的关系：历史发展的必然性规定了人的活动要受规律制约，但不否认人在可能空间内的选择；选择是否正确只能由实践检验。"], "examples": ["材料题真题：「南昆铁路建成」说明正确发挥主观能动性必须按客观规律办事、从客观实际条件出发、依赖一定物质条件和手段。"], "stats": {"hits": 94, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c1-k6", "title": "1.6 联系、发展及其五对范畴", "importance": 5, "dimension": "记忆/理解", "match_terms": ["普遍联系", "发展", "新事物", "本质与现象", "必然性和偶然性", "原因和结果", "可能性与现实性", "内容和形式"], "content": ["联系和发展是唯物辩证法的总特征。联系具有客观性、普遍性、多样性、条件性——「一切以时间、地点、条件为转移」是关于联系条件性的唯物辩证法观点。", "发展的实质是新事物的产生和旧事物的灭亡。新事物符合历史发展的必然趋势，具有旧事物不可比拟的优越性：「沉舟侧畔千帆过，病树前头万木春」「芳林新叶催陈叶，流水前波让后波」都体现新事物代替旧事物是发展的总趋势。", "五对基本范畴：本质与现象（透过现象看本质，现象表现本质、本质决定现象）；必然性与偶然性（必然性通过偶然性为自己开辟道路，透过偶然揭示必然——「蝴蝶效应」说明事物通过一系列中介环节相联系）；原因与结果（包含时间先后次序在内的引起与被引起关系）；可能性与现实性（区分几种不同可能性，努力使好的可能转化为现实）；内容与形式（内容决定形式，反对形式主义与形式虚无主义）。"], "examples": ["选择题真题：慧能观点与韩非「世异则事异」的异同比较；「不积跬步无以至千里」体现量变是质变的前提；价值规律中价格围绕价值上下波动体现必然性通过偶然性开辟道路。"], "stats": {"hits": 911, "files_hit": 5, "data_stars": 3}, "importance_source": "data+ai(max)"}, {"id": "c1-k7", "title": "1.7 对立统一规律（矛盾学说）", "importance": 5, "dimension": "理解/分析", "match_terms": ["对立统一规律", "矛盾", "同一性", "斗争性", "普遍性", "特殊性", "主要矛盾", "矛盾的主要方面", "两点论", "重点论"], "content": ["对立统一规律是唯物辩证法体系的实质和核心。原因：它揭示了事物普遍联系的根本内容和永恒发展的内在动力；是贯穿质量互变规律、否定之否定规律以及各范畴的中心线索；矛盾分析方法是认识世界和改造世界的根本方法；是否承认对立统一是辩证法与形而上学斗争的焦点。", "矛盾是反映事物内部和事物之间对立统一关系的哲学范畴。同一性和斗争性是矛盾的两种基本属性：同一性指矛盾双方相互依存、相互贯通的性质和趋势（一方的存在以对方的存在为前提）；斗争性指矛盾双方相互排斥、相互分离的性质和趋势。同一性是相对的、有条件的，斗争性是绝对的、无条件的；斗争性寓于同一性之中。辩证的同一是以差别和对立为前提的同一，「和谐」是矛盾双方的一种特殊状态而非绝对同一。", "矛盾同一性和斗争性在事物发展中的作用：同一性使矛盾双方相互吸取有利于自身的因素得到发展，规定事物发展的方向；斗争性推动矛盾双方力量变化，实现事物的质变。", "矛盾的普遍性与特殊性（共性与个性、一般与个别）是矛盾问题的精髓：二者相互联结（普遍性寓于特殊性之中，特殊性包含普遍性）、相互区别（共性不能完全包括个性）、在一定条件下相互转化。这一原理是坚持马克思主义普遍真理与具体实践相结合的哲学基础，是建设中国特色社会主义的哲学根据——「中国特色」是个性、特殊性，「社会主义」是共性、普遍性。", "矛盾发展的不平衡性：主要矛盾与次要矛盾、矛盾的主要方面与次要方面。坚持「两点论」与「重点论」的统一，反对一点论与均衡论。矛盾分析方法是根本的认识方法，具体问题具体分析。"], "examples": ["论述题真题：「试述矛盾的普遍性和特殊性的辩证关系原理及其对建设中国特色社会主义的重要指导意义」；「白马非马」割裂普遍性与特殊性；鞋厂「一区一策」材料题运用矛盾普遍性与特殊性分析。"], "stats": {"hits": 585, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c1-k8", "title": "1.8 质量互变规律与否定之否定规律", "importance": 5, "dimension": "记忆/理解", "match_terms": ["质量互变规律", "量变", "质变", "度", "适度原则", "否定之否定", "辩证否定", "扬弃", "前进性", "曲折性"], "content": ["质是一事物区别于其他事物的内在规定性；量是事物存在和发展的规模、程度等可以用数量表示的规定性；度是保持事物质的稳定性的数量界限，区分量变与质变的根本标志是事物的变化是否超出了度的范围。掌握适度原则（并非任何时候都不许超过度，而是将活动控制在适度范围内）。", "量变与质变的辩证关系：量变是质变的必要准备，质变是量变的必然结果（「天下难事必作于易」「积土成山」）；质变体现和巩固量变的成果，为新的量变开辟道路；量变质变相互渗透（总体量变中有部分质变，质变中有量的扩张）。只承认量变否认质变导致庸俗进化论，只承认质变否认量变导致激变论。", "辩证否定观的基本内容：否定是事物的自我否定（内部矛盾运动的结果）；否定是事物发展的环节和联系的环节；辩证否定的实质是「扬弃」——既克服又保留，新事物对旧事物既批判又继承、既克服其消极因素又保留其积极因素。「取其精华、弃其糟粕」即扬弃的态度。形而上学否定观则把否定看作外在的、一刀两断的抛弃。", "否定之否定规律揭示了事物发展的方向和道路：两次否定、三个阶段构成一个周期，事物发展呈现螺旋式上升或波浪式前进——前进性与曲折性的统一。「沉舟侧畔千帆过」也体现发展的前进性。"], "examples": ["简答真题：「简述辩证否定观的基本内容」；判断题：「否定就是新旧事物一刀两断」错误、「量变质变是事物发展的动力和源泉」错误（动力源泉是矛盾）。"], "stats": {"hits": 522, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}]}, {"id": "c2", "title": "第二章 实践与认识及其发展规律（认识论）", "overview": "以实践为基础考察认识的本质与过程、真理与价值，是哲学部分第二大重点章。", "importance": 5, "knowledge_points": [{"id": "c2-k1", "title": "2.1 实践与认识的辩证关系", "importance": 5, "dimension": "记忆/理解", "match_terms": ["实践", "认识", "直接现实性", "能动反映", "感性认识", "理性认识"], "content": ["实践的观点是马克思主义认识论的首要的和基本的观点。实践是认识的基础，对认识具有决定作用：实践是认识的来源、认识发展的动力、认识的目的、检验认识真理性的唯一标准。", "马克思主义实践观与传统哲学实践观的根本区别：马克思主义哲学在实践基础上理解人与世界的关系，把实践作为认识论的基础；辩证唯物主义认识论的两个突出特点是：把实践观点引入认识论（科学地规定了认识主体与客体及其关系）和把辩证法贯彻于反映论（揭示认识发展的辩证过程）。", "两条根本对立的认识路线：一条是「从物到感觉和思想」的唯物主义反映论路线；一条是「从思想和感觉到物」的唯心主义先验论路线。", "认识是主体在实践基础上对客体的能动反映，既具有摹写性（反映客体）又具有创造性（对客体信息进行加工改造）。"], "examples": ["选择题真题：「纸上得来终觉浅，绝知此事要躬行」强调实践是认识的来源；「社会上一旦有技术上的需要，则这种需要会比十所大学更能把科学推向前进」说明实践是认识发展的动力。"], "stats": {"hits": 1194, "files_hit": 5, "data_stars": 4}, "importance_source": "data+ai(max)"}, {"id": "c2-k2", "title": "2.2 认识的运动过程（两次飞跃与总规律）", "importance": 5, "dimension": "理解", "match_terms": ["第一次飞跃", "第二次飞跃", "感性认识", "理性认识", "经验论", "唯理论", "直接经验", "间接经验"], "content": ["认识的第一次飞跃是从感性认识到理性认识：感性认识是认识的初级阶段，具有直接性和形象性，包括感觉、知觉、表象三种形式；理性认识是认识的高级阶段，具有抽象性和间接性，包括概念、判断、推理三种形式。感性认识有待于上升到理性认识，理性认识依赖于感性认识，二者相互渗透并在实践基础上统一。", "夸大感性认识而贬低理性认识是经验论（经验主义），夸大理性认识而贬低感性认识是唯理论（唯理主义）；「跟着感觉走」本质上是唯心主义经验论的观点。", "认识的第二次飞跃是从理性认识到实践——由认识到实践的飞跃意义更为重大：只有回到实践才能实现认识的目的、检验和发展认识。", "认识运动的总规律：实践、认识、再实践、再认识，循环往复以至无穷，认识运动不断反复和无限发展。直接经验与间接经验是「源」与「流」的关系——直接经验来源于亲身实践，间接经验最终也来源于实践（「读万卷书」是间接经验，「行万里路」是直接经验）。"], "examples": ["材料题真题：「读万卷书、行万里路」反映直接经验与间接经验的关系；评析经验论与唯理论材料（夸大感性/理性的对立观点）。"], "stats": {"hits": 195, "files_hit": 3, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c2-k3", "title": "2.3 真理与价值", "importance": 5, "dimension": "记忆/理解", "match_terms": ["真理", "客观性", "绝对性", "相对性", "真理与谬误", "实践是检验真理的唯一标准", "价值", "价值评价", "真理尺度", "价值尺度"], "content": ["真理是标志主观符合客观的哲学范畴，是人们对客观事物及其规律的正确认识。真理的根本属性是客观性——凡真理都是客观真理，承认真理的客观性是真理问题上的唯物论，「在真理面前人人平等」依据正在于此。", "真理的绝对性与相对性（是同一直理的两种属性而非两种真理）：绝对性指真理内容客观、发展无限；相对性指真理有条件、有限（在广度深度上有待扩展深化）。二者相互包含、相互转化——无数相对真理的总和构成绝对真理。坚持绝对性与相对性的统一，反对绝对主义（教条主义、思想僵化）和相对主义（怀疑主义、诡辩论）。", "真理与谬误：对立（是否与客观符合）又统一（相比较而存在、在一定条件下相互转化），「彼亦一是非，此亦一是非」若理解为主观真理论则是否认真理客观性的观点。", "实践是检验真理的唯一标准，这是由真理的本性（主观符合客观）和实践的特点（直接现实性）决定的。实践标准的确定性（绝对性）：只有实践才能检验真理，最终标准只有一个；不确定性（相对性）：实践检验是一个过程，一定历史阶段的实践有局限性，逻辑证明是重要补充但不能取代实践标准。", "价值是客体对主体需要的满足关系，具有客观性、主体性、社会历史性、多维性。价值评价以主客体的价值关系为认识对象，正确的价值评价必须符合客观规律与人民根本利益。成功的实践必然是真理尺度（按客观规律办事）与价值尺度（满足人的需要）的统一。"], "examples": ["论述题真题：「运用绝对真理和相对真理的辩证关系原理，说明如何正确对待马列主义、毛泽东思想」；材料题真题：恩格斯/波普尔/爱因斯坦科学观对比——真理与谬误的斗争推动科学发展。"], "stats": {"hits": 1836, "files_hit": 4, "data_stars": 5}}, {"id": "c2-k4", "title": "2.4 认识世界与改造世界", "importance": 3, "dimension": "理解", "match_terms": ["思想路线", "实事求是", "理论创新", "实践创新", "自由与必然"], "content": ["认识世界的目的是改造世界。马克思主义认识论与党的思想路线高度一致：一切从实际出发、理论联系实际、实事求是、在实践中检验真理和发展真理。党的群众路线是马克思主义认识论在领导工作中的运用。", "实践基础上的理论创新是社会发展和变革的先导。「没有革命的理论，就没有革命的行动」说明科学理论对实践有指导作用（并非理论对实践起决定作用）。", "自由与必然：必然是事物发展的规律性，自由是对必然的认识和对客观世界的改造；自由王国指人们摆脱了自然和社会关系的奴役、成为自己社会关系主人的状态（共产主义社会中人的「自由个性」全面发展）。"], "examples": ["选择题真题：「实践基础上的理论创新是社会发展和变革的先导」；「自由王国」的含义辨析。"], "stats": {"hits": 34, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}]}, {"id": "c3", "title": "第三章 人类社会及其发展规律（唯物史观）", "overview": "社会基本矛盾—动力系统—人民群众三步结构清晰，是简答与材料分析的高频命题区。", "importance": 5, "knowledge_points": [{"id": "c3-k1", "title": "3.1 社会存在与社会意识", "importance": 5, "dimension": "记忆/理解", "match_terms": ["社会存在", "社会意识", "相对独立性", "唯物史观", "唯心史观", "地理环境", "人口因素", "生产方式"], "content": ["历史观的基本问题是社会存在与社会意识的关系问题：社会存在决定社会意识的是唯物史观；社会意识决定社会存在的是唯心史观。「谋事在人，成事在天」是宿命论的历史观；爱尔维修「意见支配世界」陷入唯心史观。", "社会存在是社会生活的物质方面，包括自然地理环境、人口因素和物质生产方式，其中物质生产方式是社会历史发展的决定力量（对社会发展起决定作用的社会物质生活条件）；地理环境和人口因素对社会发展起加速或延缓作用，不起决定作用（地理环境决定论、人口决定论是错误的）。", "社会意识是社会生活的精神方面，相对独立性表现在：与社会存在发展的不完全同步性和不平衡性（「经济上落后的国家在哲学上仍然能演奏第一提琴」）；历史继承性；各种社会意识形式之间的相互影响；对社会存在能动的反作用（最突出的表现——先进的社会意识促进社会发展，落后的阻碍）。", "社会意识不完全随经济基础同步变化：「社会经济发展水平越高，思想理论水平也越高」的说法是错误的。"], "examples": ["材料题真题：爱尔维修「环境决定意见」与「物质生活的生产方式制约着整个社会生活」的对比（唯心史观与唯物史观的根本分歧在谁决定谁）；保障性住房、仓廪实而知礼节、文化软实力材料体现社会存在决定社会意识与社会意识的能动反作用。"], "stats": {"hits": 244, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c3-k2", "title": "3.2 生产力与生产关系", "importance": 5, "dimension": "记忆/理解", "match_terms": ["生产力", "生产关系", "劳动资料", "劳动对象", "所有制", "矛盾运动规律", "科学技术"], "content": ["生产力是人类改造自然的物质力量，基本要素包括劳动者、劳动资料、劳动对象；劳动资料（生产工具）是衡量生产力水平的客观尺度，「各种经济时代的区别不在于生产什么，而在于怎样生产、用什么劳动资料生产」；科学技术是先进生产力的集中体现和主要标志，是第一生产力（渗透性要素）。", "生产关系是人们在物质生产过程中结成的经济关系（人与人的关系），内容包括生产资料所有制关系、人们在生产中的地位和相互关系、产品分配关系，其中生产资料所有制关系是最基本的、决定性的方面，是划分生产关系类型的基本标志。", "生产力与生产关系的辩证关系：生产力决定生产关系（状况决定性质、发展要求决定变革）；生产关系反作用于生产力（适合则促进，不适合则阻碍）。", "生产关系一定要适合生产力状况的规律是人类历史发展的第一条基本规律；我国社会主义初级阶段基本经济制度的理论依据正是这一规律。生产力不能跨越发展（但特定国家在社会形态上可以跨越「卡夫丁峡谷」）。"], "examples": ["选择题真题：耕牛属于生产力中的劳动资料；劳动发展史是理解全部社会发展史的钥匙；社会主义初级阶段基本经济制度的理论依据是生产关系必须适应生产力性质的规律。"], "stats": {"hits": 405, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c3-k3", "title": "3.3 经济基础与上层建筑", "importance": 4, "dimension": "记忆/理解", "match_terms": ["经济基础", "上层建筑", "国家政权", "意识形态", "矛盾运动规律", "国体", "政体"], "content": ["经济基础是同生产力一定发展阶段相适应的生产关系的总和；上层建筑是建立在一定经济基础之上的意识形态以及相应的制度和设施，包括政治上层建筑（政治法律制度、设施，国家政权是其核心）和观念上层建筑（意识形态）。上层建筑对经济基础的反作用，取决于它所服务的经济基础的性质——适合先进生产关系的上层建筑推动社会进步。", "上层建筑一定要适合经济基础状况的规律是社会历史发展的第二条基本规律。国家的起源与实质：国家是阶级矛盾不可调和的产物，实质是阶级统治的工具；国体与政体（人民代表大会制度是我国的政权组织形式即政体）。", "社会形态是同生产力发展一定阶段相适应的经济基础与上层建筑的统一体；社会形态更替具有统一性与多样性、必然性与人们的历史选择性、前进性与曲折性。"], "examples": ["选择题真题：上层建筑的核心是国家政权；「一切社会变迁和政治变革的终极原因应当到生产方式和交换方式的变更中去寻找」。"], "stats": {"hits": 203, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c3-k4", "title": "3.4 社会基本矛盾与社会发展动力", "importance": 5, "dimension": "理解/分析", "match_terms": ["社会基本矛盾", "根本动力", "阶级斗争", "社会革命", "改革", "科学技术", "历史合力"], "content": ["社会基本矛盾（生产力与生产关系、经济基础与上层建筑的矛盾）是社会发展的根本动力。社会主要矛盾是社会基本矛盾在一定阶段的集中体现，新时代我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。", "阶级斗争是阶级社会发展的直接动力；社会革命根源于社会基本矛盾的尖锐化，是社会的质变（「无论哪一个社会形态，在它所能容纳的全部生产力发挥出来以前，是决不会灭亡的」——社会革命时代的到来有其客观条件）；改革是同一社会形态发展过程中的量变和部分质变，是社会主义制度的自我完善。", "科学技术是社会发展的有力杠杆：科技革命推动生产方式、生活方式和思维方式的变革，但「科学技术发展可以解决一切社会问题」的观点错误；科学技术的社会作用具有两重性。", "历史发展是「合力」作用的结果——无数个人意志相互作用形成历史合力，但这并不否认历史规律的客观性。"], "examples": ["简答/判断高频：「社会革命根源于社会基本矛盾的尖锐化」；「生产力是社会发展的最终决定力量」正确、「经济基础是最终决定力量」错误。"], "stats": {"hits": 149, "files_hit": 5, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c3-k5", "title": "3.5 人民群众是历史的创造者", "importance": 5, "dimension": "理解/分析", "match_terms": ["人民群众", "历史创造者", "英雄史观", "群众史观", "群众路线", "人的本质", "历史人物"], "content": ["唯心史观（英雄史观）主张社会意识决定社会存在，夸大少数英雄人物的作用；唯物史观（群众史观）主张人民群众是历史的主体和历史的创造者——人民群众是社会物质财富、精神财富的创造者，是社会变革的决定力量。", "人的本质在其现实性上是一切社会关系的总和（不是单个人固有的抽象物，不是自然属性、不是自由、不是自私）。", "英雄人物在历史上有重要作用（可以加速或延缓历史进程），但不能决定历史发展的基本趋势；「人民群众和英雄人物共同创造历史」的说法混淆了创造历史的主体，是错误的。", "群众观点和群众路线：一切为了群众、一切依靠群众，从群众中来、到群众中去。以人民为中心的发展思想是马克思主义群众史观在新时代的体现。", "评价历史人物的科学方法：历史分析方法与阶级分析方法相结合。"], "examples": ["材料题真题：「新英雄史观」（创造者创造历史）否定社会存在决定社会意识、夸大英雄作用；黄旭华、黄大年等先进人物材料需结合「个人在历史上的作用」与「理想信念」作答。"], "stats": {"hits": 111, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}]}, {"id": "c4", "title": "第四章 资本主义的本质及规律（政治经济学上）", "overview": "劳动价值论与剩余价值论两大理论，占考分约 20%，计算类选择题与概念辨析是主要考法。", "importance": 4, "knowledge_points": [{"id": "c4-k1", "title": "4.1 商品经济与劳动价值论", "importance": 5, "dimension": "记忆/理解", "match_terms": ["商品经济", "使用价值", "价值", "具体劳动", "抽象劳动", "价值规律", "货币", "社会必要劳动时间", "私人劳动和社会劳动"], "content": ["商品经济是以交换为目的而进行生产的经济形式，产生的社会历史条件是社会分工和生产资料私有制。商品是用来交换的劳动产品，具有使用价值和价值两个因素。", "商品的二因素由生产商品的劳动二重性决定：具体劳动生产使用价值（人与自然的关系，劳动的自然属性）；抽象劳动形成价值（人与人的社会关系，劳动的社会属性）。价值是凝结在商品中的无差别的一般人类劳动，是商品的社会属性、本质因素；使用价值是价值的物质承担者。", "商品的价值量由生产商品的社会必要劳动时间决定，与社会必要劳动时间成正比，与劳动生产率成反比——部门劳动生产率提高，单位商品价值量降低，同一时间内创造的价值总量不变。", "价值规律是商品经济的基本规律：内容是商品的价值量由社会必要劳动时间决定、交换以价值量为基础实行等价交换；表现形式是价格围绕价值上下波动（这正是必然性通过偶然性为自己开辟道路）。作用：自发调节资源配置、刺激改进技术提高劳动生产率、优胜劣汰（也会导致两极分化、资源浪费）。", "价值形式的发展催生货币：货币是固定充当一般等价物的商品；货币转化为资本的前提是劳动力成为商品。商品转换为货币被马克思称为「商品的惊险的跳跃」。", "以私有制为基础的商品经济的基本矛盾是私人劳动与社会劳动的矛盾；商品内在使用价值与价值的矛盾，其完备的外在表现形式是商品与货币的对立。"], "examples": ["选择题真题：耕牛属于劳动资料；「不积跬步」不属本章；判断题真题：「具体劳动和抽象劳动是两种不同的劳动」——错误，是同一劳动的两个方面；「劳动是使用价值的唯一源泉」——错误（劳动不是唯一源泉，自然界也是）；「有价值的东西一定是商品」真题判为正确，注意结合具体考法辨析。"], "stats": {"hits": 1839, "files_hit": 4, "data_stars": 5}}, {"id": "c4-k2", "title": "4.2 剩余价值的生产", "importance": 5, "dimension": "记忆/理解", "match_terms": ["劳动力商品", "剩余价值", "不变资本", "可变资本", "绝对剩余价值", "相对剩余价值", "超额剩余价值", "资本主义生产过程的二重性"], "content": ["劳动力成为商品的两个基本条件：劳动者有人身自由（可以出卖劳动力）、劳动者丧失生产资料（不得不出卖劳动力）。劳动力商品的最大特点在于其使用价值是价值的源泉，而且是大于自身价值的价值源泉。", "货币转化为资本：资本家购买的不是工人的劳动而是劳动力；剩余价值的产生既不在流通领域、又离不开流通领域。", "资本主义生产过程具有二重性：生产使用价值的劳动过程与生产剩余价值的价值增殖过程的统一。", "不变资本（c，生产资料形式存在的资本，通过具体劳动转移旧价值）与可变资本（v，劳动力形式存在的资本，创造包括剩余价值的新价值）的划分依据是资本不同部分在价值增殖过程中的作用不同；剩余价值只能由可变资本带来，雇佣劳动者的剩余劳动是剩余价值的唯一源泉。", "生产剩余价值的两种基本方法：绝对剩余价值生产（绝对延长工作日）；相对剩余价值生产（社会劳动生产率提高、必要劳动时间缩短，是全社会劳动生产率提高的结果）；超额剩余价值是个别企业提高劳动生产率的结果，是相对剩余价值产生的前提（个别资本家追逐超额剩余价值的竞争导致相对剩余价值）。"], "examples": ["选择题真题：资本家购买的是劳动力而非劳动；相对剩余价值的获得是社会劳动生产率提高的结果；「剩余价值的产生既不在流通领域又离不开流通领域」判断为正确。"], "stats": {"hits": 391, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c4-k3", "title": "4.3 资本积累与资本流通", "importance": 4, "dimension": "记忆/理解", "match_terms": ["资本积累", "资本有机构成", "相对过剩人口", "资本循环", "资本周转", "固定资本", "流动资本", "经济危机"], "content": ["资本积累是剩余价值的资本化（把剩余价值转化为资本），是资本主义扩大再生产的源泉；资本积累的必然结果是资本有机构成提高、相对过剩人口（产业后备军）的出现和贫富两极分化。", "资本有机构成 c:v 由资本的技术构成决定并反映技术构成的变化，具体表现为不变资本与可变资本的比率；有机构成提高导致利润率下降趋势。", "资本循环：产业资本依次经过购买、生产、销售三个阶段，分别采取货币资本、生产资本、商品资本三种职能形式，回到原点的运动；连续循环的两个前提是产业资本三种职能形式在空间上并存、在时间上继起。", "资本周转：影响周转速度的因素有固定资本与流动资本的构成比例和周转时间；预付资本总周转速度加快可以提高年剩余价值量与年剩余价值率。", "社会总资本再生产的核心问题是社会总产品的实现问题（价值补偿与实物补偿）；资本主义经济危机的实质是生产相对过剩（不是绝对过剩），根源在于资本主义基本矛盾——生产社会化与生产资料资本主义私人占有之间的矛盾；危机的周期性（危机、萧条、复苏、高涨四阶段）源于资本主义基本矛盾运动的特点。"], "examples": ["选择题真题：社会资本再生产的核心问题；经济危机的本质特征是生产相对过剩；资本循环的三种职能形式为货币资本、生产资本、商品资本。"], "stats": {"hits": 167, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c4-k4", "title": "4.4 剩余价值的分配与资本主义政治制度", "importance": 3, "dimension": "记忆/理解", "match_terms": ["工资", "利润", "平均利润", "剩余价值规律", "政治制度", "选举"], "content": ["资本主义工资的本质是劳动力的价值或价格，却表现为「劳动的价值或价格」——这是资本主义剥削关系被掩盖的原因（表现为劳动的价值或价格时掩盖了剥削）。", "剩余价值转化为利润（剩余价值被看作全部预付资本的产物）；利润率是剩余价值与全部预付资本的比率；部门间竞争使利润率平均化形成平均利润，价值转化为生产价格。", "剩余价值规律是资本主义的基本经济规律；资本主义生产方式的绝对规律是生产剩余价值。", "资本主义政治制度的本质是为资产阶级服务的，其形式上的平等掩盖事实上的不平等；资本主义国家选举的实质是协调统治阶级内部利益关系和矛盾的重要措施；美国立法权属于国会（三权分立的权力制衡形式）。"], "examples": ["选择题真题：资本主义工资之所以掩盖剥削，是由于它表现为劳动的价值或价格；垄断资本主义阶段占统治地位的资本是金融资本。"], "stats": {"hits": 289, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}]}, {"id": "c5", "title": "第五章 资本主义的发展及其趋势（政治经济学下）", "overview": "垄断资本主义理论与当代资本主义新变化，分值占比低，以概念性选择题为主。", "importance": 3, "knowledge_points": [{"id": "c5-k1", "title": "5.1 从自由竞争到垄断", "importance": 4, "dimension": "记忆", "match_terms": ["垄断", "金融资本", "金融寡头", "参与制", "垄断利润", "垄断价格"], "content": ["自由竞争引起生产和资本集中，发展到一定阶段必然引起垄断；垄断代替自由竞争成为经济生活的根本标志，资本主义进入垄断（帝国主义）阶段。", "垄断没有消除竞争（垄断与竞争并存）：垄断条件下存在垄断组织之间的竞争、垄断组织内部的竞争、垄断组织与非垄断企业的竞争。", "金融资本是由工业垄断资本和银行垄断资本融合形成的资本；金融寡头在经济上的统治主要通过「参与制」实现，在政治上通过「个人联合」实现。", "垄断利润的来源归根到底是对工人阶级和劳动人民创造的价值的剥削；垄断价格（=成本价格+垄断利润）不能否定价值规律，它没有也不可能消灭价值规律（只是改变了价值规律作用的形式）。"], "examples": ["判断题高频：「垄断消除了竞争」错误；「为了获取高额垄断利润可以任意抬高垄断价格」错误——垄断价格要受市场需求与竞争制约。"], "stats": {"hits": 353, "files_hit": 4, "data_stars": 2}, "importance_source": "data+ai(max)"}, {"id": "c5-k2", "title": "5.2 国家垄断资本主义与经济全球化", "importance": 3, "dimension": "记忆", "match_terms": ["国家垄断资本主义", "经济全球化", "宏观调节", "微观规制"], "content": ["国家垄断资本主义是国家政权和私人垄断资本融为一体的垄断资本主义，主要形式有：国家对私人企业施加影响的间接调节、国家与私人资本合营、国家直接掌握垄断资本（国有企业）。", "国家垄断资本主义的实质是私人垄断资本利用国家机器来为其利益服务的手段，是符合垄断资产阶级整体利益的制度安排；它的出现没有从根本上改变垄断资本主义的性质、没有消除资本主义基本矛盾。国家垄断资本主义的主要方式包括宏观调节与微观规制。", "经济全球化的表现：生产的全球化、贸易的全球化、金融的全球化、企业经营的全球化；其动因在于科技革命与生产力发展提供的坚实基础、跨国公司的推动。经济全球化是一把「双刃剑」。"], "examples": ["选择题真题：经济全球化的表现；「国家垄断资本主义的出现消除了经济的竞争」「消灭了私人垄断资本主义的基础」——均为错误判断。"], "stats": {"hits": 97, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c5-k3", "title": "5.3 当代资本主义新变化与历史地位", "importance": 3, "dimension": "理解/分析", "match_terms": ["新变化", "历史进步性", "局限性", "资本主义基本矛盾", "必然性", "长期性"], "content": ["当代资本主义新变化的主要表现：生产资料所有制（个体资本—股份资本—法人资本—国家资本）、劳资关系与分配关系、社会阶层与阶级结构、经济调节机制与经济危机形态、政治制度的变化。", "新变化的原因：科技革命与生产力发展的推动、工人阶级争取自身权利斗争的作用、社会主义制度显示出的优越性对资本主义的影响、改良主义政党的推动；实质是资本主义生产关系的自我调整，没有改变资本主义的根本性质、没有克服资本主义的基本矛盾。", "资本主义的历史地位：历史进步性（摧毁封建制度、解放和发展生产力）与自身局限性并存；社会主义代替资本主义是历史发展的必然趋势（生产社会化与私人占有的矛盾决定了资本主义必然被更高级的社会形态取代），但这是一个长期、曲折的历史过程——东欧剧变、苏联解体并不表明社会主义的失败。"], "examples": ["判断题真题：「社会主义代替资本主义是不依人们意志为转移的必然要实现的客观规律」正确；「因此就不可能反复」错误（长期性与曲折性）。"], "stats": {"hits": 64, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}]}, {"id": "c6", "title": "第六章 社会主义的发展及其规律（科学社会主义上）", "overview": "从空想到科学的飞跃与科学社会主义一般原则，以概念记忆为主。", "importance": 3, "knowledge_points": [{"id": "c6-k1", "title": "6.1 社会主义从空想到科学", "importance": 4, "dimension": "记忆", "match_terms": ["空想社会主义", "科学社会主义", "唯物史观", "剩余价值学说", "理论依据"], "content": ["空想社会主义的历史贡献：对资本主义制度的深刻批判、对未来社会的天才设想；局限：没有揭示资本主义必然灭亡的经济根源、没有找到推翻资本主义的社会力量、没有找到实现理想社会的现实道路。", "唯物史观和剩余价值学说这两大发现，使社会主义从空想变为科学——它们是科学社会主义创立的理论依据。", "「通过批判旧世界来发现新世界」是马克思主义预见未来社会的方法，与空想社会主义凭天才想象描绘未来蓝图根本不同。"], "examples": ["选择题高频：科学社会主义创立的理论依据是唯物史观和剩余价值学说（不是空想社会主义学说或德国古典哲学）。"], "stats": {"hits": 95, "files_hit": 5, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c6-k2", "title": "6.2 科学社会主义一般原则与社会主义实践", "importance": 3, "dimension": "记忆", "match_terms": ["一般原则", "无产阶级政党", "无产阶级专政", "一国胜利", "经济文化落后国家"], "content": ["科学社会主义一般原则（9条要点）：坚持科学社会主义基本原则与本国实际相结合、坚持无产阶级政党的领导、坚持无产阶级专政、坚持公有制与按劳分配为主体的分配制度、坚持有计划的调节经济、坚持人的全面发展、坚持无产阶级国际主义、坚持消灭阶级差别与三大差别、坚持共产主义远大理想。", "正确把握科学社会主义一般原则：必须始终坚持、必须与本国实际相结合（不能当作教条）、必须敢于在实践中丰富发展。", "经济文化相对落后的国家可以先于资本主义国家进入社会主义，其根本原因在于革命的客观形势和条件；这是历史发展规律作用的结果，并不违背生产力决定生产关系的规律（社会主义生产关系可以在特定条件下跨越建立）。", "社会主义在苏联的实践（苏联模式的成就与弊端）与中国道路：中国特色社会主义是科学社会主义基本原则与中国实际相结合的产物。"], "examples": ["判断题真题：「在经济文化相对落后的国家率先取得社会主义胜利，也是历史发展规律作用的结果」——正确。"], "stats": {"hits": 16, "files_hit": 2, "data_stars": 1}, "importance_source": "data+ai(max)"}]}, {"id": "c7", "title": "第七章 共产主义崇高理想及其最终实现（科学社会主义下）", "overview": "共产主义社会的基本特征与实现的历史必然性，多为概念性选择题与判断题。", "importance": 2, "knowledge_points": [{"id": "c7-k1", "title": "7.1 展望共产主义社会", "importance": 3, "dimension": "记忆", "match_terms": ["共产主义", "自由王国", "自由个性", "按需分配", "人的自由全面发展", "必然王国"], "content": ["马克思主义预见未来社会的方法论原则（4条）：在揭示人类社会发展规律的基础上指明社会发展的方向；在剖析资本主义社会旧世界中阐发新世界的特点；立足于揭示未来社会的一般特征而不作详尽的细节描绘；坚持发展观点看待未来社会。", "共产主义社会的基本特征：社会生产力高度发展、物质财富极大丰富；实行各尽所能、按需分配（分配方式）；阶级消亡、国家消亡（自行消亡）；每个人自由而全面的发展（共产主义社会的根本特征/基本原则）。", "「自由王国」指人们摆脱了自然和社会关系的奴役、成为自己社会关系主人的状态；实现人的「自由个性」的发展是共产主义社会中人的生存状态（不是资本主义或社会主义阶段）。"], "examples": ["选择题真题：各尽所能按需分配是共产主义的分配方式；自由王国的含义辨析；判断题「共产主义社会没有矛盾」——错误（旧式矛盾消亡，新矛盾仍存在）。"], "stats": {"hits": 132, "files_hit": 4, "data_stars": 1}, "importance_source": "data+ai(max)"}, {"id": "c7-k2", "title": "7.2 共产主义理想实现的必然性与长期性", "importance": 2, "dimension": "理解", "match_terms": ["历史必然性", "两个必然", "漫长历史过程", "远大理想", "共同理想"], "content": ["共产主义理想实现的必然性：资本主义基本矛盾的发展决定了它必然被更高的社会形态所代替；实现是一个漫长的历史过程（生产力发展、人的全面发展的长期性）。", "「两个必然」（资产阶级的灭亡和无产阶级的胜利是同样不可避免的）与「两个决不会」（无论哪一个社会形态在它所能容纳的全部生产力发挥出来以前是决不会灭亡的）的统一：前者指明趋势，后者指明条件与长期性。", "坚持远大理想与共同理想的统一：共产主义远大理想与中国特色社会主义共同理想是最终目标与现阶段目标的统一；无产阶级解放斗争的最终目标是实现共产主义。"], "examples": ["判断题真题：「共产主义理想的实现是一个漫长的历史过程」正确；「社会主义代替资本主义是历史必然，因此不可能反复」错误。"], "stats": {"hits": 41, "files_hit": 3, "data_stars": 1}, "importance_source": "data+ai(max)"}]}], "keywords": ["哲学基本问题：思维和存在的关系问题（本原问题划分唯物/唯心，同一性问题划分可知/不可知）", "物质：标志客观实在的哲学范畴，唯一特性是客观实在性（列宁）", "意识：人脑的机能，客观存在的主观映象（形式主观、内容客观）", "度：保持事物质稳定性的数量界限，量变质变的根本标志", "扬弃：辩证否定的实质，既克服又保留", "实践：人类能动地改造客观世界的物质活动，具有直接现实性", "真理：标志主观符合客观的哲学范畴，检验标准唯一且为实践", "社会存在：社会生活的物质方面（地理环境、人口因素、生产方式）", "生产力三要素：劳动者、劳动资料、劳动对象", "生产关系：人们在生产中结成的经济关系，所有制是决定性方面", "商品二因素：使用价值与价值（劳动二重性：具体劳动与抽象劳动决定）", "剩余价值：雇佣工人剩余劳动创造、被资本家无偿占有的价值（唯一源泉是剩余劳动）", "不变资本与可变资本：按在价值增殖中的作用划分（c 与 v）", "资本主义基本矛盾：生产社会化与生产资料资本主义私人占有的矛盾", "经济危机实质：生产相对过剩", "金融寡头经济统治方式：参与制", "科学社会主义两大理论基石：唯物史观与剩余价值学说", "共产主义分配原则：各尽所能、按需分配"], "exam_profile": {"source": ["马克思主义基本原理概论 复习框架.pptx（总复习幻灯片：期末考试题型及分数比例）"], "total_score": 100, "duration": 120, "total_questions": 18, "notes": "原卷画像来自任课教师总复习PPT：闭卷，卷面100分（总评=闭卷60%+平时30%+期中10%）；重点为绪论与第1-4章（哲学约70%、政治经济学约20%、绪论与科社约10%）。难度按认知要求估计：单选概念辨析为 medium，直接记忆为 easy；材料分析与论述需原理联系实际为 hard。", "sections": [{"id": "choice", "label": "一、单项选择题", "question_type": "choice", "question_count": 10, "score_each": 2, "total_score": 20, "difficulty_counts": {"easy": 6, "medium": 4, "hard": 0}}, {"id": "short", "label": "二、简答题", "question_type": "short", "question_count": 4, "score_each": 5, "total_score": 20, "difficulty_counts": {"easy": 1, "medium": 2, "hard": 1}}, {"id": "material", "label": "三、材料分析题", "question_type": "reading", "question_count": 2, "score_each": 10, "total_score": 20, "difficulty_counts": {"easy": 0, "medium": 1, "hard": 1}}, {"id": "essay", "label": "四、论述题", "question_type": "short", "question_count": 2, "score_each": 20, "total_score": 40, "difficulty_counts": {"easy": 0, "medium": 1, "hard": 1}}]}, "mock_exams": [{"name": "预测试卷（A 卷）", "duration": 120, "total_score": 100, "sections": [{"type": "一、单项选择题（每小题 2 分，共 20 分）", "profile_id": "choice", "question_type": "choice", "instruction": "每小题给出的四个选项中，只有一项最符合题目要求。", "questions": [{"q": "恩格斯认为，全部哲学、特别是近代哲学的重大的基本问题是（　）", "options": ["A. 哲学与人类生存活动之间的内在联系问题", "B. 人与周围世界的基本联系问题", "C. 思维和存在的关系问题", "D. 关于人的本质问题"], "answer": "C", "analysis": "对应知识点「1.1 哲学基本问题」：哲学基本问题是思维和存在的关系问题，包括本原（第一性）与同一性两个方面。属直接记忆，easy。", "kp_id": "c1-k1", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "物质的唯一特性是（　）", "options": ["A. 客观实在性", "B. 实物性", "C. 结构性", "D. 可分性"], "answer": "A", "analysis": "对应「1.2 物质观」：列宁的物质定义——物质是标志客观实在的哲学范畴，客观实在性是唯一特性。", "kp_id": "c1-k2", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "时间和空间分别是物质运动的（　）", "options": ["A. 广延性和持续性", "B. 持续性和广延性", "C. 顺序性和伸张性", "D. 一维性和三维性"], "answer": "B", "analysis": "对应「1.3 运动观与时空观」：时间是物质运动的持续性、顺序性（一维性）；空间是广延性、伸张性（三维性）。注意题干是「分别是」，先时间后空间。", "kp_id": "c1-k3", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "唯物辩证法体系的实质和核心是（　）", "options": ["A. 质量互变规律", "B. 否定之否定规律", "C. 对立统一规律", "D. 联系和发展的观点"], "answer": "C", "analysis": "对应「1.7 对立统一规律」：对立统一规律揭示了普遍联系的根本内容和发展的内在动力，是贯穿其他规律和范畴的中心线索，故为实质和核心。", "kp_id": "c1-k7", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "宋代诗人陆游说：「纸上得来终觉浅，绝知此事要躬行。」这强调的是（　）", "options": ["A. 读书不能获得真知", "B. 实践是认识发展的动力", "C. 实践是认识的来源", "D. 实践是认识的目的"], "answer": "C", "analysis": "对应「2.1 实践与认识的辩证关系」：「躬行」即亲身实践，强调实践是认识的来源。注意与「认识发展动力」（技术需要推动科学）区分。", "kp_id": "c2-k1", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "感性认识的三种基本形式是（　）", "options": ["A. 概念、判断、推理", "B. 感觉、知觉、表象", "C. 假设、演绎、归纳", "D. 知觉、表象、推理"], "answer": "B", "analysis": "对应「2.2 认识的运动过程」：感性认识包括感觉、知觉、表象；理性认识包括概念、判断、推理。属直接记忆。", "kp_id": "c2-k2", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "「经济上落后的国家在哲学上仍然能演奏第一提琴」，这体现社会意识具有（　）", "options": ["A. 与社会存在发展的不完全同步性和不平衡性", "B. 历史继承性", "C. 对社会存在的决定作用", "D. 各种意识形式之间的相互影响"], "answer": "A", "analysis": "对应「3.1 社会存在与社会意识」：社会意识相对独立性的首要表现即发展不完全同步、不平衡；C 项颠倒了社会存在与社会意识的关系。", "kp_id": "c3-k1", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "商品的使用价值和价值的矛盾，其完备的外在表现形式是（　）", "options": ["A. 商品与商品的对立", "B. 商品与货币的对立", "C. 资本与雇佣劳动的对立", "D. 生产者与消费者的对立"], "answer": "B", "analysis": "对应「4.1 商品经济与劳动价值论」：价值形式发展为货币后，商品内在矛盾外化为商品与货币的对立（惊险的跳跃）。", "kp_id": "c4-k1", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "相对剩余价值的获得是（　）", "options": ["A. 个别企业提高劳动生产率的结果", "B. 生产部门提高劳动生产率的结果", "C. 社会劳动生产率提高的结果", "D. 延长工作日长度的结果"], "answer": "C", "analysis": "对应「4.2 剩余价值的生产」：相对剩余价值是在工作日长度不变时，通过全社会劳动生产率提高、缩短必要劳动时间而获得；个别企业提高生产率获得的是超额剩余价值；延长工作日属于绝对剩余价值生产。", "kp_id": "c4-k2", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "实现了人的「自由个性」的发展，是（　）", "options": ["A. 资本主义社会以前的人的生存状态", "B. 资本主义社会之中的人的生存状态", "C. 社会主义社会之中的人的生存状态", "D. 共产主义社会之中的人的生存状态"], "answer": "D", "analysis": "对应「7.1 展望共产主义社会」：共产主义社会实现每个人自由而全面的发展，「自由个性」是其生存状态标志。", "kp_id": "c7-k1", "score": 2, "difficulty": "easy", "type": "choice"}]}, {"type": "二、简答题（每小题 5 分，共 20 分）", "profile_id": "short", "question_type": "short", "instruction": "要点完整、条理清楚即可得分。", "questions": [{"q": "简述辩证否定观的基本内容。", "answer": "辩证的否定是事物自身的否定。第一，否定是事物的自我否定，是事物内部矛盾运动的结果；第二，否定是事物发展的环节，是实现新事物产生、促使旧事物灭亡的根本途径；第三，否定是新旧事物联系的环节；第四，辩证否定的实质是「扬弃」，即新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素。", "analysis": "对应「1.8 质量互变规律与否定之否定规律」；答出四个要点并点明扬弃即可。", "kp_id": "c1-k8", "score": 5, "difficulty": "medium", "type": "short"}, {"q": "为什么说实践是检验真理的唯一标准？", "answer": "这是由真理的本性和实践的特点决定的。第一，真理的本性是主观与客观相符合，检验真理就是检验主观认识是否与客观实际相符合，这要求检验标准必须能够把主观和客观联系起来加以对照；第二，实践具有直接现实性的特点，是连接主观与客观的桥梁，能把观念的东西变成现实的东西，使对照成为可能；第三，理论本身和客观事物自身都不能充当这种桥梁，逻辑证明只是实践标准的重要补充，不能代替实践成为标准。", "analysis": "对应「2.3 真理与价值」；从真理本性、实践特点两方面作答是得分关键。", "kp_id": "c2-k3", "score": 5, "difficulty": "medium", "type": "short"}, {"q": "简述社会意识的相对独立性及其主要表现。", "answer": "社会意识在依赖社会存在的同时，具有自身相对独立性，主要表现为：第一，社会意识与社会存在发展的不完全同步性和不平衡性；第二，社会意识的发展具有历史继承性；第三，各种社会意识形式之间相互影响、相互作用；第四，社会意识对社会存在具有能动的反作用（最突出的表现，先进的社会意识促进社会发展，落后的社会意识阻碍社会发展）。", "analysis": "对应「3.1 社会存在与社会意识」；相对独立性四点表现是简答高频考点。", "kp_id": "c3-k1", "score": 5, "difficulty": "easy", "type": "short"}, {"q": "简述劳动力商品区别于普通商品的特殊性。", "answer": "劳动力商品的特殊性在于其使用价值：劳动力的使用价值是价值的源泉，并且是大于劳动力自身价值的价值源泉。劳动力价值的构成包括维持劳动者本人生存所需的生活资料价值、养活家庭所需的生活资料价值、教育训练费用，并包含历史和道德的因素。正是这一特殊性，使货币转化为资本、使资本家获得剩余价值成为可能——雇佣劳动者的剩余劳动是剩余价值的唯一源泉。", "analysis": "对应「4.2 剩余价值的生产」；核心是「使用价值是价值源泉」这一点，能引申到剩余价值来源更佳。", "kp_id": "c4-k2", "score": 5, "difficulty": "hard", "type": "short"}]}, {"type": "三、材料分析题（每小题 10 分，共 20 分）", "profile_id": "material", "question_type": "reading", "instruction": "结合材料，运用所学原理分析回答问题。", "questions": [{"q": "阅读下列关于世界本原问题的材料并回答：(1) 评析材料1、2、3的哲学观点及异同；(2) 材料4说明什么原理？坚持这一原理有何意义？", "type": "reading", "stimulus": {"title": "材料", "paragraphs": ["材料1：古希腊哲学家泰勒斯认为，万物由水产生，又复归于水；万物有生有灭，而水则是永恒的。赫拉克利特认为，这个世界对于一切存在物都是一样的，它不是任何神创造的，也不是任何人创造的；它过去、现在和未来永远是一团永恒的活火。", "材料2：毕达哥拉斯学派认为，从数目产生出点，从点产生出线，从线产生出平面，从平面产生出立体，从立体产生出感觉所及的一切物体——数是万物的本原。", "材料3：东汉哲学家王充认为：天覆于上，地偎于下，下气蒸上，上气降下，万物自生其中间。天地合气，万物自生。", "材料4：恩格斯指出：世界的真正的统一性在于它的物质性。"], "source": "改编自「⭐期末考题训练 材料分析题」第3题及期末考点材料题参考"}, "answer": "(1) 三种观点有相同之处也有不同之点：相同之处在于都坚持世界是统一的（都是一元论）；不同在于材料1、3是朴素的唯物主义观点，把世界统一为某种具体的物质形态（泰勒斯归结为水、王充归结为气）；材料2是客观唯心主义观点，把世界的本原归结为数这一客观的精神性因素。(2) 材料4说明世界的物质统一性原理。其意义：第一，它是整个马克思主义哲学的基石和理论体系的起点，表明马克思主义哲学是彻底的、科学的唯物主义一元论；第二，它是反对二元论、宗教神学和唯心主义的锐利武器；第三，它具有重要的实践意义，是一切从实际出发、实事求是思想路线的根本理论基础。", "analysis": "对应「1.2 物质观」与「1.4 世界的物质统一性」。评析题套路：先判流派（朴素唯物/客观唯心），再指依据（把本原归于什么），最后落到马克思主义的物质统一性原理及其三点意义。", "kp_id": "c1-k2", "score": 10, "difficulty": "medium"}, {"q": "阅读下列材料并回答：(1) 上述材料体现了什么哲学原理？请具体说明。(2) 结合材料2，说明这一原理对我们实现奋斗目标的现实意义。", "type": "reading", "stimulus": {"title": "材料", "paragraphs": ["材料1：《道德经》说：合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。《韩非子》说：天下难事，必作于易；天下大事，必作于细。", "材料2：党的二十大擘画了全面建设社会主义现代化国家的两步走战略安排：从2020年到2035年基本实现社会主义现代化；从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。宏伟蓝图的实现，需要一步一个脚印，分阶段、有步骤地持续推进。"], "source": "材料1为古代名言，材料2为党的二十大报告精神要点（AI 原创模拟情境）"}, "answer": "(1) 体现量变和质变的辩证关系原理。量变是质变的必要准备，量变达到一定程度、超出度的范围必然引起质变，质变是量变的必然结果；质变又为新的量变开辟道路。材料1中「生于毫末」「起于累土」「始于足下」「作于易、作于细」都说明事物的变化发展总是从量变开始，通过量的积累达到质变。(2) 现实意义：社会主义现代化强国目标（质变）必须通过长期的艰苦奋斗和点滴积累（量变）来实现；我们要脚踏实地、埋头苦干，正确处理当前与长远的关系，既不好高骛远，也不急于求成，把每一个阶段的目标落到实处；同时在量变积累过程中注意把握「度」，防微杜渐，避免事物向坏的方向发生质变。", "analysis": "对应「1.8 质量互变规律」。答题结构：原理（量变质变关系）→ 材料印证 → 现实意义（结合中国式现代化分步走）。此题为原理联系实际的综合运用，hard。", "kp_id": "c1-k8", "score": 10, "difficulty": "hard"}]}, {"type": "四、论述题（每小题 20 分，共 40 分）", "profile_id": "essay", "question_type": "short", "instruction": "观点正确、原理阐述完整、理论联系实际、逻辑清楚。", "questions": [{"q": "试述社会存在与社会意识的辩证关系原理，并结合新时代加强文化建设的实际说明其意义。", "answer": "(1) 社会存在是社会生活的物质方面，包括自然地理环境、人口因素和物质生产方式；社会意识是社会生活的精神方面。二者辩证关系：第一，社会存在决定社会意识，社会意识是社会存在的反映——有什么样的社会存在，就有什么样的社会意识；社会存在的变化发展决定社会意识的变化发展。第二，社会意识具有相对独立性，对社会存在具有能动的反作用：先进的社会意识对社会发展起积极的推动作用，落后的社会意识起消极的阻碍作用。(2) 意义：第一，文化建设必须立足中国式现代化的伟大实践——社会存在决定社会意识，新时代文化产品的内容与形式归根到底源于社会主义经济建设的实践；第二，高度重视先进社会意识的能动反作用——大力培育和践行社会主义核心价值观，发展社会主义先进文化，为经济社会发展提供强大精神动力，提高国家文化软实力；第三，正确处理文化与经济的关系，既看到经济对文化的决定作用，又看到文化发展的相对独立性和先导性，「经济上落后的国家在哲学上仍然能演奏第一提琴」，坚定文化自信；第四，一种社会意识发挥作用的程度，同它掌握群众的深度广度紧密相连，要通过宣传教育和实践养成使先进意识为群众所掌握，转化为强大物质力量。", "analysis": "对应「3.1 社会存在与社会意识」。论述题评分点：原理两层（决定作用+能动反作用）各占约1/3，联系实际占1/3；文化自信、文化软实力是新时代时政结合点。", "kp_id": "c3-k1", "score": 20, "difficulty": "medium", "type": "short"}, {"q": "试述实践与认识的辩证关系原理，并说明这一原理是党的思想路线的哲学基础。", "answer": "(1) 实践与认识的辩证关系：第一，实践是认识的基础，对认识起决定作用——实践是认识的来源、认识发展的动力、认识的目的、检验认识真理性的唯一标准。第二，认识对实践具有能动的反作用——正确的理论指导实践走向成功，错误的理论把实践引向失败；理论创新是社会发展和变革的先导。(2) 这一原理是党的思想路线的哲学基础：党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。一切从实际出发，体现实践是认识的来源和基础；理论联系实际，体现认识必须回到实践、接受实践检验；实事求是，体现尊重实践基础上发挥正确认识的指导作用；在实践中检验和发展真理，直接体现实践是检验真理的唯一标准及认识的反复性、无限性。(3) 方法论要求：坚持实事求是，反对教条主义和经验主义；把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，在实践中丰富和发展真理；青年学生学习中也要坚持知行合一，在实践中增长才干。", "analysis": "对应「2.1 实践与认识的辩证关系」与「2.4 认识世界与改造世界」。评分点：实践决定作用的四条、认识的能动反作用、思想路线四个内容与原理的对应、结合实际（可写两个结合、知行合一）。", "kp_id": "c2-k1", "score": 20, "difficulty": "hard", "type": "short"}]}]}, {"name": "预测试卷（B 卷）", "duration": 120, "total_score": 100, "sections": [{"type": "一、单项选择题（每小题 2 分，共 20 分）", "profile_id": "choice", "question_type": "choice", "instruction": "每小题给出的四个选项中，只有一项最符合题目要求。", "questions": [{"q": "马克思主义具有强大生命力的根源在于（　）", "options": ["A. 以实践为基础的科学性与革命性的统一", "B. 与时俱进", "C. 科学性与阶级性的统一", "D. 科学性"], "answer": "A", "analysis": "对应「0.3 马克思主义的鲜明特征」：马克思主义强大生命力的根源是以实践为基础的科学性与革命性的统一；与时俱进是最重要的理论品质。", "kp_id": "c0-k3", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "「人不能两次踏进同一条河流」和「人一次也不能踏进同一条河流」这两种观点是（　）", "options": ["A. 前者是辩证法，后者是诡辩论", "B. 前者是形而上学，后者是辩证法", "C. 是相同的，只是强调的方面不同", "D. 二者都是辩证法，后者是对前者的发展"], "answer": "A", "analysis": "对应「1.3 运动观与时空观」：前者承认绝对运动中有相对静止（辩证法），后者夸大绝对运动、否认相对静止（诡辩论，割裂绝对运动与相对静止的关系）。", "kp_id": "c1-k3", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "区分量变和质变的根本标志是事物的变化是否超出了（　）", "options": ["A. 质的规定性", "B. 度的范围", "C. 量的界限", "D. 矛盾的方面"], "answer": "B", "analysis": "对应「1.8 质量互变规律」：度是保持事物质的稳定性的数量界限，是否超出度是量变质变的根本标志。", "kp_id": "c1-k8", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "辩证唯物主义认识论认为，认识的本质是（　）", "options": ["A. 主体对客体的直观反映", "B. 主体对客体的自由创造", "C. 客体对主体的作用", "D. 主体在实践基础上对客体的能动反映"], "answer": "D", "analysis": "对应「2.1 实践与认识的辩证关系」：认识是主体在实践基础上对客体的能动反映——既摹写又创造，与旧唯物主义直观反映论、唯心主义先验论相区别。", "kp_id": "c2-k1", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "真理的绝对性是指它的（　）", "options": ["A. 永恒性", "B. 客观性", "C. 不变性", "D. 终极性"], "answer": "B", "analysis": "对应「2.3 真理与价值」：真理的绝对性首先指真理的内容是客观的（无条件的），其次指人类认识按其本性能够无限接近客观世界。", "kp_id": "c2-k3", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "历史观的基本问题是（　）", "options": ["A. 生产力和生产关系的关系问题", "B. 社会规律和主观意识的关系问题", "C. 社会存在和社会意识的关系问题", "D. 自然和社会的关系问题"], "answer": "C", "analysis": "对应「3.1 社会存在与社会意识」：历史观基本问题是社会存在与社会意识的关系问题，这是哲学基本问题在社会历史领域的贯彻。", "kp_id": "c3-k1", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "划分生产关系类型的基本标志是（　）", "options": ["A. 产品的分配形式", "B. 生产资料的所有制形式", "C. 人们在生产中的地位", "D. 生产关系与生产力的矛盾性质"], "answer": "B", "analysis": "对应「3.2 生产力与生产关系」：生产资料所有制关系是生产关系中最基本的、决定性的方面。", "kp_id": "c3-k2", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "从众多商品中分离出来、固定地充当一般等价物的商品是（　）", "options": ["A. 价格", "B. 商标", "C. 样品", "D. 货币"], "answer": "D", "analysis": "对应「4.1 商品经济与劳动价值论」：价值形式长期发展的结果产生了固定充当一般等价物的货币。", "kp_id": "c4-k1", "score": 2, "difficulty": "easy", "type": "choice"}, {"q": "资本主义经济危机的本质特征是（　）", "options": ["A. 生产相对不足", "B. 生产严重不足", "C. 生产相对过剩", "D. 生产绝对过剩"], "answer": "C", "analysis": "对应「4.3 资本积累与资本流通」：经济危机的实质是生产相对过剩——相对于劳动人民有支付能力的需求而言过剩，不是绝对过剩。", "kp_id": "c4-k3", "score": 2, "difficulty": "medium", "type": "choice"}, {"q": "垄断资本主义阶段占统治地位的资本是（　）", "options": ["A. 金融资本", "B. 银行资本", "C. 工业资本", "D. 商业资本"], "answer": "A", "analysis": "对应「5.1 从自由竞争到垄断」：工业垄断资本与银行垄断资本融合形成金融资本，其统治以金融寡头为代表、以参与制为经济实现方式。", "kp_id": "c5-k1", "score": 2, "difficulty": "medium", "type": "choice"}]}, {"type": "二、简答题（每小题 5 分，共 20 分）", "profile_id": "short", "question_type": "short", "instruction": "要点完整、条理清楚即可得分。", "questions": [{"q": "简述哲学基本问题的内容和划分哲学基本派别的标准。", "answer": "哲学基本问题是思维和存在（物质和意识）的关系问题，包括两方面内容：一是思维和存在何者为世界的本原、谁是第一性的问题；二是思维能否认识存在的问题。对第一方面的不同回答把哲学划分为唯物主义和唯心主义两个基本派别——主张物质第一性、物质决定意识的是唯物主义，主张意识第一性、意识决定物质的是唯心主义。对第二方面的不同回答划分为可知论与不可知论。", "analysis": "对应「1.1 哲学基本问题」；基本框架题，属送分题。", "kp_id": "c1-k1", "score": 5, "difficulty": "easy", "type": "short"}, {"q": "简述感性认识和理性认识的辩证关系。", "answer": "第一，感性认识是认识的初级阶段，是对事物现象、外部联系的认识，具有直接性和形象性；理性认识是认识的高级阶段，是对事物本质、内部联系的认识，具有抽象性和间接性。第二，理性认识依赖于感性认识，感性认识是理性认识的基础；感性认识有待于发展和深化为理性认识。第三，感性认识和理性认识相互渗透、相互包含，二者的区分是相对的，在实践的基础上统一起来。割裂二者会导致唯理论（夸大理性）或经验论（夸大感性）的错误。", "analysis": "对应「2.2 认识的运动过程」；辩证关系三条+两种错误倾向是完整答案结构。", "kp_id": "c2-k2", "score": 5, "difficulty": "medium", "type": "short"}, {"q": "为什么说人民群众是历史的创造者？", "answer": "人民群众是社会历史的主体，是历史的创造者：第一，人民群众是社会物质财富的创造者——劳动群众的物质生产实践是社会存在和发展的基础；第二，人民群众是社会精神财富的创造者——群众的实践活动是一切精神财富的源泉，群众也直接参与了精神财富的创造；第三，人民群众是社会变革的决定力量——在社会形态更替过程中，人民群众是推动社会由低级向高级发展的决定力量。人民群众创造历史的活动受社会历史条件（经济、政治、精神文化条件）的制约。", "analysis": "对应「3.5 人民群众是历史的创造者」；三个创造者+受历史条件制约即为完整要点。", "kp_id": "c3-k5", "score": 5, "difficulty": "medium", "type": "short"}, {"q": "简述价值规律的基本内容、表现形式及其作用。", "answer": "基本内容：商品的价值量由生产商品的社会必要劳动时间决定，商品交换以价值量为基础，按照等价交换的原则进行。表现形式：价格围绕价值上下波动。作用：第一，自发地调节社会资源在各个生产部门之间的配置；第二，自发地刺激社会生产力的发展（刺激改进技术、提高劳动生产率）；第三，自发地实现优胜劣汰，促进商品生产者的分化。消极后果：可能导致社会资源浪费、收入分配差距扩大（两极分化）。", "analysis": "对应「4.1 商品经济与劳动价值论」；内容+形式+三作用一后果为标准答案结构。", "kp_id": "c4-k1", "score": 5, "difficulty": "hard", "type": "short"}]}, {"type": "三、材料分析题（每小题 10 分，共 20 分）", "profile_id": "material", "question_type": "reading", "instruction": "结合材料，运用所学原理分析回答问题。", "questions": [{"q": "阅读上述材料并回答：(1) 三位思想家在科学理论发展问题上的共同观点是什么？(2) 用真理和谬误的辩证关系原理，说明科学发展的过程。", "type": "reading", "stimulus": {"title": "材料", "paragraphs": ["材料1：恩格斯指出，科学史就是把谬误逐渐消除或者代之以新的、但终归是比较不荒诞的谬误的历史。", "材料2：波普尔说，衡量一种理论的科学地位是它的可证伪性；科学知识的增长并不是观察的积累，而是不断推翻一种理论，由另一种更好的理论取而代之。", "材料3：爱因斯坦说：从广义相对论推出的许多结论中，只要有一个被证明是错误的，它就必然被抛弃。"], "source": "改编自「⭐期末考题训练 材料分析题」第12题"}, "answer": "(1) 共同观点：科学是一个不断发现真理、检验真理、修正错误、发展真理的过程，任何科学理论都不是终极真理，都要接受实践的反复检验，在批判与自我批判中发展。(2) 真理和谬误是对立统一的关系：二者有原则界限（是否与客观实际相符合），又相比较而存在、在一定条件下相互转化。真理的发展过程就是同谬误作斗争并不断战胜谬误的过程；人们在实践中发现真理、检验真理、修正错误，使认识不断深化。恩格斯强调科学史是在真理与谬误斗争中不断证实真理、克服谬误、发展真理的历程；波普尔指出科学必须不断批判和改正错误有合理性，但把可证伪性当作科学的唯一标志、把科学发展简单归结为一种理论推翻另一种理论是片面的；爱因斯坦对待自己理论的严格态度体现了科学精神的自我批判性。实践是检验真理的唯一标准，科学理论正是在实践中不断修正、丰富和发展的。", "analysis": "对应「2.3 真理与价值」。评析类材料题：先提炼共同点，再用真理谬误辩证关系原理分评三位思想家的观点（肯定合理+指出局限）。", "kp_id": "c2-k3", "score": 10, "difficulty": "medium"}, {"q": "阅读上述材料并回答：(1) 说明社会基本矛盾是社会发展根本动力的原理。(2) 结合材料，分析全面深化改革的哲学依据及其重要意义。", "type": "reading", "stimulus": {"title": "材料", "paragraphs": ["材料：党的十八届三中全会作出全面深化改革的决定，指出改革开放是决定当代中国命运的关键一招。当前，我国发展的环境深刻变化，一些深层次体制机制障碍和结构性矛盾仍然突出，必须进一步解放和发展社会生产力、进一步激发和凝聚社会创造力。全面深化改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。"], "source": "根据党的十八届三中全会公报精神改写（AI 原创模拟情境）"}, "answer": "(1) 社会基本矛盾是生产力与生产关系、经济基础与上层建筑的矛盾。生产力决定生产关系，生产关系反作用于生产力；经济基础决定上层建筑，上层建筑反作用于经济基础。生产关系一定要适合生产力状况的规律、上层建筑一定要适合经济基础状况的规律，共同构成社会发展的基本规律。社会基本矛盾的运动贯穿人类社会发展始终，是社会发展的根本动力：当生产关系和上层建筑适合生产力发展要求时，推动社会发展；当其成为生产力发展的桎梏时，就要求通过变革（改革或革命）加以解决，从而解放和发展生产力。(2) 哲学依据与意义：第一，全面深化改革是社会主义社会基本矛盾运动的客观要求——我国社会主 const theme = {mode:"light", bright:100, tint:0, eyeCare:false};
function loadTheme(){ try{ const s=localStorage.getItem("srb_theme"); if(s) Object.assign(theme, JSON.parse(s)); }catch(e){} }
function saveTheme(){ try{ localStorage.setItem("srb_theme", JSON.stringify(theme)); }catch(e){} }
function applyTheme(){
  document.documentElement.dataset.theme = theme.mode;
  document.getElementById("btnThemeMode").textContent = theme.mode==="dark" ? "☀️" : "🌙";
  const eyeBtn = document.getElementById("eyeCareBtn");
  if (eyeBtn) eyeBtn.classList.toggle("on", !!theme.eyeCare);
  const dim = document.getElementById("dimLayer"), tint = document.getElementById("tintLayer");
  // 护眼模式：柔和暖光 + 适度降亮（低蓝光护眼），覆盖手动参数
  if (theme.eyeCare){
    dim.style.background = "rgba(0,0,0,0.16)";
    dim.style.mixBlendMode = "multiply"; dim.style.display = "block";
    tint.style.background = "rgba(255,160,50,0.32)";
    tint.style.mixBlendMode = "multiply"; tint.style.display = "block";
  } else {
    if (theme.bright < 100){
      dim.style.background = `rgba(0,0,0,${(100-theme.bright)/100*0.72})`;
      dim.style.mixBlendMode = "multiply"; dim.style.display = "block";
    } else if (theme.bright > 100){
      dim.style.background = `rgba(255,255,255,${(theme.bright-100)/100*0.42})`;
      dim.style.mixBlendMode = "screen"; dim.style.display = "block";
    } else dim.style.display = "none";
    if (theme.tint > 0){
      tint.style.background = `rgba(255,140,40,${theme.tint/100*0.45})`;
      tint.style.mixBlendMode = "multiply"; tint.style.display = "block";
    } else if (theme.tint < 0){
      tint.style.background = `rgba(70,130,255,${-theme.tint/100*0.40})`;
      tint.style.mixBlendMode = "multiply"; tint.style.display = "block";
    } else tint.style.display = "none";
  }
  document.getElementById("rgBright").value = theme.bright;
  document.getElementById("rgTint").value = theme.tint;
  document.getElementById("vBright").textContent = theme.bright + "%";
  document.getElementById("vTint").textContent = theme.tint>0?("暖 "+theme.tint):(theme.tint<0?("冷 "+(-theme.tint)):"中性");
}
function toggleThemeMode(){ theme.mode = theme.mode==="dark"?"light":"dark"; applyTheme(); saveTheme(); }
function toggleThemePanel(){ document.getElementById("themePanel").classList.toggle("open"); }
function toggleEyeCare(){
  theme.eyeCare = !theme.eyeCare;
  applyTheme(); saveTheme();
}
function onThemeSlider(which){
  theme.bright = +document.getElementById("rgBright").value;
  theme.tint = +document.getElementById("rgTint").value;
  theme.eyeCare = false;   // 手动调节即退出护眼预设
  applyTheme(); saveTheme();
}
function resetTheme(){ theme.mode="light"; theme.bright=100; theme.tint=0; theme.eyeCare=false; applyTheme(); saveTheme(); }

  const starBadge = st ? `<span style="color:${starColor(st)};font-size:14px">${starStr(st)}</span>` : "";
  const body = (kp.content||[]).map(p=>`<p>${esc(p)}</p>`).join("") +
    (kp.examples||[]).map(e=>`<div class="ex">▶ ${esc(e)}</div>`).join("");
  return `<div class="kp" data-stars="${st}" id="kp-${esc(kp.id)}">
    <div class="kp-head"><span class="num">${esc(kp.title)}</span>${starBadge}${dim}${hits}</div>
    <div class="kp-body">${body}</div></div>`;
}
