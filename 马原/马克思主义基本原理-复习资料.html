/* ================= 知识图谱（Obsidian 风格） ================= */
const G = {nodes:[], links:[], alpha:1, frames:0, running:false, fitted:false,
           scale:1, tx:0, ty:0, inited:false, adj:[]};
let nodeDrag=null, panDrag=null, hoverIdx=-1;

function buildGraph(){
  const svg = document.getElementById("gsvg");
  const NS = "http://www.w3.org/2000/svg";
  const N = G.nodes, L = G.links;
  N.push({id:"__root", type:"root", label:DATA.title, color:"#7FB3E8", stars:0, hits:0,
          r:28, terms:[], ch:-1, x:(Math.random()-.5)*300, y:(Math.random()-.5)*300, vx:0, vy:0});
  DATA.chapters.forEach((ch,i)=>{
    const col = GCH[i%GCH.length];
    const ci = N.length;
    N.push({id:"ch"+i, type:"ch", label:ch.title, color:col, stars:0, hits:0, r:16,
            terms:[], ch:ci, x:(Math.random()-.5)*500, y:(Math.random()-.5)*500, vx:0, vy:0});
    L.push({a:0, b:ci, kind:"tree", color:col, rest:300});
    (ch.knowledge_points||[]).forEach(kp=>{
      const st = kp.importance||0, hits = (kp.stats&&kp.stats.hits)||0;
      N.push({id:kp.id, type:"kp", label:kp.title, color:col, stars:st, hits,
              r: Math.max(9, Math.min(19, 7+st*1.8+Math.min(hits,20)*.3)),
              terms:kp.match_terms||[], ch:ci,
              x:(Math.random()-.5)*500, y:(Math.random()-.5)*500, vx:0, vy:0});
      L.push({a:ci, b:N.length-1, kind:"tree", color:col, rest:150+st*8});
    });
  });
  const kps = N.filter(n=>n.type==="kp" && n.terms.length);
  const cand = [];
  for (let i=0;i<kps.length;i++) for (let j=i+1;j<kps.length;j++){
    if (kps[i].ch===kps[j].ch) continue;
    const shared = kps[i].terms.filter(t=>kps[j].terms.includes(t));
    if (shared.length) cand.push({a:N.indexOf(kps[i]), b:N.indexOf(kps[j]), w:shared.length});
  }
  cand.sort((x,y)=>y.w-x.w);
  cand.slice(0,12).forEach(c=>L.push({a:c.a, b:c.b, kind:"cross", color:"#7E8CA0", rest:330, w:c.w}));

  // 邻接表
  G.adj = N.map(()=>new Set());
  L.forEach(l=>{ G.adj[l.a].add(l.b); G.adj[l.b].add(l.a); });

  // defs：辉光 + 柔和阴影滤镜
  const defs = document.createElementNS(NS,"defs");
  defs.innerHTML = `
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="rgba(0,0,0,.35)"/>
    </filter>`;
  svg.appendChild(defs);

  const root = document.createElementNS(NS,"g");
  const gl = document.createElementNS(NS,"g");
  const gn = document.createElementNS(NS,"g");
  root.setAttribute("id","groot"); gl.setAttribute("id","glinks"); gn.setAttribute("id","gnodes");
  root.appendChild(gl); root.appendChild(gn); svg.appendChild(root);
  G.rootG = root;

  L.forEach(l=>{
    l.el = document.createElementNS(NS,"line");
    l.el.setAttribute("stroke", l.color);
    l.el.setAttribute("stroke-width", l.kind==="tree"?1.7:1.2);
    l.el.setAttribute("opacity", l.kind==="tree"?0.5:0.45);
    if (l.kind==="cross") l.el.setAttribute("stroke-dasharray","5 5");
    gl.appendChild(l.el);
  });
  N.forEach(n=>{
    const g = document.createElementNS(NS,"g");
    g.setAttribute("class","gnode");
    const halo = document.createElementNS(NS,"circle");
    halo.setAttribute("r", n.r+3.5); halo.setAttribute("fill", n.color);
    halo.setAttribute("opacity", n.type==="kp"?0.22:0.30);
    g.appendChild(halo);
    const c = document.createElementNS(NS,"circle");
    c.setAttribute("r", n.r);
    c.setAttribute("fill", n.color);
    c.setAttribute("fill-opacity", n.type==="kp"?0.95:1);
    if (n.type==="kp"){ c.setAttribute("stroke", starColor(n.stars)); c.setAttribute("stroke-width",2.6); }
    else { c.setAttribute("stroke","rgba(255,255,255,.35)"); c.setAttribute("stroke-width",1.6); }
    c.setAttribute("filter","url(#softshadow)");
    g.appendChild(c);
    const t = document.createElementNS(NS,"text");
    t.textContent = n.label.length>16? n.label.slice(0,15)+"…" : n.label;
    t.setAttribute("x", n.r+7); t.setAttribute("y", 4.5);
    t.setAttribute("font-size", n.type==="root"?14:(n.type==="ch"?12.5:11));
    t.setAttribute("font-weight", n.type==="kp"?"normal":"bold");
    t.setAttribute("fill", n.type==="kp"?"var(--glabel)":"var(--glabel)");
    t.setAttribute("style","fill:var(--glabel)");
    g.appendChild(t);
    const tip = document.createElementNS(NS,"title");
    tip.textContent = n.type==="kp"
      ? `${n.label}｜${n.stars}星｜真题命中${n.hits}次` : n.label;
    g.appendChild(tip);
    n.el = g; n.txt = t; gn.appendChild(g);
    const idx = N.indexOf(n);

    g.addEventListener("mouseenter", ()=>{ hoverIdx = idx; highlight(idx); });
    g.addEventListener("mouseleave", ()=>{ hoverIdx = -1; clearHighlight(); });
    g.addEventListener("mousedown", e=>{
      e.stopPropagation();
      nodeDrag = {n, x0:e.clientX, y0:e.clientY, moved:false};
      G.alpha = Math.max(G.alpha, 0.3); startSim();
    });
    g.addEventListener("click", ()=>{
      if (n.type==="kp" && !nodeDrag && !g.__dragged) jumpToKp(n.id);
    });
  });

  // 图例
  let lg = "";
  DATA.chapters.forEach((ch,i)=>{
    lg += `<div><i style="background:${GCH[i%GCH.length]}"></i>${esc(ch.title.length>14?ch.title.slice(0,13)+"…":ch.title)}</div>`;
  });
  lg += `<div style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px">
    <span class="sw"></span>考点关联（共享术语）<br>
    <i style="background:#7FB3E8"></i>节点大小≈星级+命中<br>
    <i style="background:transparent;border:2px solid ${SC[5]}"></i>外环色＝重要度</div>`;
  document.getElementById("glegend").innerHTML = lg;

  // 画布交互
  const box = document.getElementById("gsvgBox");
  svg.addEventListener("mousedown", e=>{
    panDrag = {x0:e.clientX, y0:e.clientY, tx0:G.tx, ty0:G.ty};
  });
  window.addEventListener("mousemove", e=>{
    if (nodeDrag){
      const rect = box.getBoundingClientRect();
      const wx = (e.clientX-rect.left-G.tx)/G.scale, wy = (e.clientY-rect.top-G.ty)/G.scale;
      nodeDrag.n.x = wx; nodeDrag.n.y = wy;
      nodeDrag.n.vx = 0; nodeDrag.n.vy = 0;
      if (Math.hypot(e.clientX-nodeDrag.x0, e.clientY-nodeDrag.y0) > 5){
        nodeDrag.moved = true; nodeDrag.n.el.__dragged = true;
      }
    } else if (panDrag){
      G.tx = panDrag.tx0 + (e.clientX-panDrag.x0);
      G.ty = panDrag.ty0 + (e.clientY-panDrag.y0);
      applyT();
    }
  });
  window.addEventListener("mouseup", ()=>{
    if (nodeDrag && nodeDrag.moved){
      const el = nodeDrag.n.el;
      setTimeout(()=>{ el.__dragged = false; }, 60);
    }
    nodeDrag = null; panDrag = null;
  });
  box.addEventListener("wheel", e=>{
    e.preventDefault();
    const rect = box.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    const k = e.deltaY>0 ? 0.88 : 1.14;
    const ns = Math.max(0.22, Math.min(4, G.scale*k));
    G.tx = mx - (mx-G.tx)*(ns/G.scale);
    G.ty = my - (my-G.ty)*(ns/G.scale);
    G.scale = ns; applyT(); updateLabels();
  }, {passive:false});

  applyT(); updateLabels();
  G.inited = true;
}

/* ---- 邻居高亮 ---- */
function highlight(idx){
  const hl = new Set([idx]);
  G.adj[idx].forEach(j=>hl.add(j));
  G.nodes.forEach((n,i)=>{
    const on = hl.has(i);
    n.el.style.opacity = on ? 1 : 0.12;
    const c = n.el.querySelectorAll("circle")[1];
    if (c) c.setAttribute("filter", (on && i!==idx) ? "url(#glow)" : "url(#softshadow)");
    if (i===idx){ const halo=n.el.querySelectorAll("circle")[0]; if(halo) halo.setAttribute("filter","url(#glow)"); }
    n.__hl = on;
  });
  G.links.forEach(l=>{
    const on = (l.a===idx || l.b===idx);
    l.el.setAttribute("opacity", on ? 0.95 : 0.06);
    l.el.setAttribute("stroke-width", (l.kind==="tree"?1.9:1.4) + (on?1.5:0));
    if (on) l.el.setAttribute("filter","url(#glow)");
    else l.el.removeAttribute("filter");
  });
  updateLabels(true);
}
function clearHighlight(){
  G.nodes.forEach(n=>{
    n.el.style.opacity = 1;
    const c = n.el.querySelectorAll("circle")[1];
    if (c) c.setAttribute("filter","url(#softshadow)");
    const halo = n.el.querySelectorAll("circle")[0];
    if (halo) halo.removeAttribute("filter");
    n.__hl = false;
  });
  G.links.forEach(l=>{
    l.el.setAttribute("opacity", l.kind==="tree"?0.5:0.45);
    l.el.setAttribute("stroke-width", l.kind==="tree"?1.7:1.2);
    l.el.removeAttribute("filter");
  });
  updateLabels();
}
/* ---- 缩放级别控制标签显示 ---- */
function updateLabels(forceHl){
  const s = G.scale;
  G.nodes.forEach(n=>{
    if (!n.txt) return;
    let show;
    if (n.__hl && forceHl) show = true;
    else if (n.type==="root" || n.type==="ch") show = true;
    else if (s >= 0.75) show = true;
    else if (s >= 0.45) show = (n.stars >= 4);
    else show = false;
    n.txt.style.display = show ? "" : "none";
  });
}
/* ---- 物理模拟（含数值防护，防 NaN/Infinity 污染渲染） ---- */
function simStep(){
  const a = G.alpha, N = G.nodes;
  if (!isFinite(a) || a <= 0) return;
  for (let i=0;i<N.length;i++) for (let j=i+1;j<N.length;j++){
    const A=N[i], B=N[j];
    if (!isFinite(A.x) || !isFinite(B.x)){ A.x = A.x||0; A.y = A.y||0; B.x = B.x||0; B.y = B.y||0; }
    let dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy;
    if (d2<1){ dx=Math.random()-.5; dy=Math.random()-.5; d2=dx*dx+dy*dy+.01; }
const d=Math.sqrt(d2), f=26000*a/d2, fx=dx/d*f, fy=dy/d*f;
    if (!isFinite(fx) || !isFinite(fy)) continue;
    A.vx-=fx; A.vy-=fy; B.vx+=fx; B.vy+=fy;
  }
  G.links.forEach(l=>{
    const A=G.nodes[l.a], B=G.nodes[l.b];
    const dx=B.x-A.x, dy=B.y-A.y, d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
    const f=(d-l.rest)*0.018*a, fx=dx/d*f, fy=dy/d*f;
    if (!isFinite(fx)) return;
    A.vx+=fx; A.vy+=fy; B.vx-=fx; B.vy-=fy;
  });
  N.forEach(n=>{
    if (!isFinite(n.x)) n.x = 0; if (!isFinite(n.y)) n.y = 0;
    n.vx -= n.x*0.0012*a; n.vy -= n.y*0.0012*a;
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(-2400, Math.min(2400, n.x));
    n.y = Math.max(-1800, Math.min(1800, n.y));
  });
  G.alpha *= 0.992;
}
function renderGraph(){
  G.links.forEach(l=>{
    const A=G.nodes[l.a], B=G.nodes[l.b];
    l.el.setAttribute("x1", isFinite(A.x)?A.x:0); l.el.setAttribute("y1", isFinite(A.y)?A.y:0);
    l.el.setAttribute("x2", isFinite(B.x)?B.x:0); l.el.setAttribute("y2", isFinite(B.y)?B.y:0);
  });
  G.nodes.forEach(n=>{
    const x = isFinite(n.x)?n.x:0, y = isFinite(n.y)?n.y:0;
    n.el.setAttribute("transform",`translate(${x},${y})`);
  });
}
function fitView(){
  const N = G.nodes, box = document.getElementById("gsvgBox");
  const xs=N.map(n=>n.x), ys=N.map(n=>n.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const bw=maxX-minX+200, bh=maxY-minY+200;
  if (!isFinite(bw) || bw <= 10 || !isFinite(bh) || bh <= 10) return;   // 防护
  const r=box.getBoundingClientRect();
  if (r.width <= 0 || r.height <= 0) return;
  G.scale = Math.min(r.width/bw, r.height/bh, 1.5);
  G.tx = r.width/2 - (minX+maxX)/2*G.scale;
  G.ty = r.height/2 - (minY+maxY)/2*G.scale;
  applyT(); updateLabels();
}
function gFit(){ fitView(); }
function gRelayout(){
  G.nodes.forEach(n=>{ n.x=(Math.random()-.5)*500; n.y=(Math.random()-.5)*500; n.vx=0; n.vy=0; });
  G.fitted = false; G.frames = 0; G.alpha = 1; startSim();
}
function applyT(){
  if (G.rootG) G.rootG.setAttribute("transform",`translate(${G.tx},${G.ty}) scale(${G.scale})`);
}
function loop(){
  if (G.alpha > 0.015){
    simStep(); renderGraph(); G.frames++;
    if (!G.fitted && G.frames > 70){ fitView(); G.fitted = true; }
    requestAnimationFrame(loop);
  } else { renderGraph(); G.running = false; }
}
function startSim(){
  if (!G.running){ G.running = true; requestAnimationFrame(loop); }
}

/* ================= 自测版（列表式 + 答案模糊揭晓，每次打开打乱） ================= */
const quiz = {order:[], revealed:{}, marks:{}};
function openQuiz(){
  const all = [];
  DATA.chapters.forEach(ch=>(ch.knowledge_points||[]).forEach(kp=>all.push(kp)));
  quiz.order = shuffle(all.slice());   // 每次打开/重新打乱都重新乱序
  quiz.revealed = {}; quiz.marks = {};
  renderQuiz();
}
function quizCounts(){
  const cs = {ok:0, ag:0};
  Object.values(quiz.marks).forEach(m=>{ if (m==="ok") cs.ok++; else if (m==="again") cs.ag++; });
  return cs;
}
function renderQuiz(){
  const box = document.getElementById("quizView");
  const total = quiz.order.length;
  if (!total){
    box.innerHTML = `<div class="q-summary"><h2>📝 暂无自测题目</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:8px">当前复习数据没有知识点。</p></div>`;
    return;
  }
  const cs = quizCounts();
  const revN = Object.keys(quiz.revealed).length;
  const pct = total ? Math.round(revN/total*100) : 0;

  let html = `<div class="q-meta" style="justify-content:space-between;align-items:center;flex-wrap:wrap">
    <span>共 <b>${total}</b> 题 · 每次打开自动打乱顺序</span>
    <span>已揭晓 <b>${revN}</b>/${total}（${pct}%）</span>
    <span>😊 <b>${cs.ok}</b> ｜ 😕 <b>${cs.ag}</b></span>
  </div>
  <div class="q-progress"><i style="width:${pct}%"></i></div>`;

  quiz.order.forEach((kp, idx)=>{
    const key = kp.id;
    const st = kp.importance||0;
    const hits = (kp.stats && kp.stats.hits)?`<span class="hits">真题命中 ${kp.stats.hits} 次</span>`:"";
    const dim = kp.dimension?`<span class="badge dim">${esc(kp.dimension)}</span>`:"";
    const shown = !!quiz.revealed[key];
    const mark = quiz.marks[key];
    const body = (kp.content||[]).map(p=>`<p>${esc(p)}</p>`).join("") +
      (kp.examples||[]).map(e=>`<div class="ex">▶ ${esc(e)}</div>`).join("");
    const mOk = mark==="ok", mAg = mark==="again";
    html += `<div class="kp q-card${shown?" revealed":""}" id="qid-${esc(key)}">
      <div class="kp-head"><span class="num">${idx+1}. ${esc(kp.title)}</span>
        <span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span style="color:${starColor(st)}">${starStr(st)}</span>${dim}${hits}</span>
      </div>
      <div class="quiz-awrap">
        <div class="kp-body quiz-body">${body}</div>
        ${shown?"":`<div class="quiz-mask" onclick="quizReveal('${escJs(key)}')"><span>👁️ 点击揭晓答案</span></div>`}
      </div>
      <div class="q-btns" style="margin-top:12px">
        <button class="btn ${shown?"btn-ghost":"btn-primary"}" onclick="quizReveal('${escJs(key)}')">${shown?"🙈 收起答案":"👁️ 揭晓答案"}</button>
        <button class="btn ${mOk?"btn-ok":"btn-ghost"}" onclick="quizMark('${escJs(key)}','ok')">😊 已掌握</button>
        <button class="btn ${mAg?"btn-again":"btn-ghost"}" onclick="quizMark('${escJs(key)}','again')">😕 再看看</button>
      </div>
    </div>`;
  });

  html += `<div class="q-btns" style="justify-content:center;margin-top:22px">
    <button class="btn btn-primary" onclick="openQuiz()">🔄 重新打乱顺序</button>
    <button class="btn btn-ghost" onclick="switchView('content')">📖 返回复习资料版</button>
  </div>`;
  box.innerHTML = html;
}
function quizReveal(key){ quiz.revealed[key] = !quiz.revealed[key]; renderQuiz(); }
function quizMark(key, role){ quiz.marks[key] = quiz.marks[key]===role ? undefined : role; renderQuiz(); }

/* ================= 预测试卷 ================= */
const EXAM = {papers:(DATA.mock_exams||[]), pi:null, answers:{}, multiLocked:{}, done:false};
function openExams(){
  if (!EXAM.papers.length){
    document.getElementById("examView").innerHTML =
      `<div class="q-summary"><h2>📋 暂无预测试卷</h2>
      <p style="color:var(--muted);font-size:13px;margin-top:8px">当前复习数据未包含试卷题目。</p></div>`;
    return;
  }
  EXAM.pi = null; EXAM.answers = {}; EXAM.done = false;
  renderExamPick();
}
function renderExamPick(){
  const cards = EXAM.papers.map((p,i)=>{
    let qn = 0, score = 0;
    (p.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{ qn++; score += (q.score||0); }));
    return `<div class="exam-card" onclick="startPaper(${i})">
      <h3>${esc(p.name||("预测试卷 "+String.fromCharCode(65+i)))}</h3>
      <div class="info">⏱ 时长 ${p.duration||120} 分钟 ｜ 满分 ${p.total_score||100} 分<br>
      📝 共 ${qn} 题 ｜ 选择题在线判分<br>📄 完成后给出得分与错题清单</div>
    </div>`;
  }).join("");
  document.getElementById("examView").innerHTML =
    `<div class="q-summary"><h2>📋 选择一套预测试卷</h2>
    <p style="color:var(--muted);font-size:13px;margin-top:6px">建议闭卷作答：选择题点击选项即时判分，主观题先自答再对照参考答案。</p>
    <div class="exam-pick" style="margin-top:14px">${cards}</div></div>`;
}
function startPaper(i){ EXAM.pi = i; EXAM.answers = {}; EXAM.multiLocked = {}; EXAM.done = false; renderPaper(); }
function qKey(si, qi){ return si+"-"+qi; }
function isLetterFillQ(q){
  // 字母填空题：答案为单个字母，或「字母 + 括号解释」（如 B、A（boost））
  // 不匹配完整单词/短语填空（如 responsibility）
  return !!(q && q.type === "fill" && /^[A-Z](?:\s*[（(][^）)]*[）)])?$/i.test(String(q.answer||"").trim()));
}
function answerLetter(q){
  const m = String(q.answer||"").trim().match(/^[A-Za-z]/);
  return m ? m[0].toUpperCase() : "";
}
function isMultiQ(q){
  // 多选题：答案为 2 个及以上纯字母组合（如 ABCDE / BD），type 建议标注 multi
  return /^[A-Za-z]{2,}$/.test(String(q.answer||"").trim());
}
function answerLetters(q){
  return String(q.answer||"").trim().toUpperCase().split("").sort();
}
function renderStimulus(stim){
  const list = Array.isArray(stim) ? stim : [stim];
  return list.filter(s=>s && typeof s==="object").map(s=>{
    const paras = (s.paragraphs && s.paragraphs.length) ? s.paragraphs : (s.text ? [s.text] : []);
    return `<div class="material-box">` +
      (s.title ? `<h4>${esc(s.title)}</h4>` : "") +
      (s.note ? `<div class="note">${esc(s.note)}</div>` : "") +
      paras.map(p=>`<p>${esc(p)}</p>`).join("") +
      (s.source ? `<div class="src">📎 来源：${esc(s.source)}</div>` : "") +
      `</div>`;
  }).join("");
}
function stimKey(s){
  if (!s || typeof s !== "object") return null;
  return (s.title||"") + "\\u0001" + (s.text||"") + "\\u0001" + (s.paragraphs||[]).join("\\u0002");
}
function renderPaper(){
  const p = EXAM.papers[EXAM.pi];
  let html = `<div class="paper-head">
    <div class="course">《${esc(courseName)}》</div>
    <div class="name">${esc(p.name||"")}</div>
    <div class="info">考试时长 ${p.duration||120} 分钟 ｜ 满分 ${p.total_score||100} 分 ｜ 在线作答</div>
  </div>`;
  let qnum = 0;
  (p.sections||[]).forEach((sec,si)=>{
    html += `<div class="sec-title">${esc(sec.type||"")}</div>`;
    if (sec.instruction) html += `<div class="sec-ins">${esc(sec.instruction)}</div>`;
    let lastStimKey = sec.stimulus ? stimKey(sec.stimulus) : null;
    if (sec.stimulus) html += renderStimulus(sec.stimulus);
    (sec.questions||[]).forEach((q,qi)=>{
      qnum++;
      const key = qKey(si,qi);
      const isChoice = !!(q.options && q.options.length);
      const isLetterFill = !isChoice && isLetterFillQ(q);
      const answered = EXAM.answers[key];
      const typeTag = q.type==="listening" ? "<span class=\"badge dim\">听力</span> " : (q.type==="reading" ? "<span class='badge dim'>阅读</span> " : "");
      html += `<div class="q-item" id="q-${si}-${qi}">
        <div class="stem">${typeTag}${qnum}. ${esc(q.q)} <span class="score-tag">（${q.score||""} 分）</span></div>`;
      if (q.stimulus && stimKey(q.stimulus) !== lastStimKey) {
        html += renderStimulus(q.stimulus);
        lastStimKey = stimKey(q.stimulus);
      }
      if (isChoice){
        const isMulti = isMultiQ(q);
        const sel = Array.isArray(answered) ? answered : [];
        const locked = isMulti ? !!EXAM.multiLocked[key] : (answered != null);
        html += `<div class="opts">` + q.options.map((opt,oi)=>{
          const letter = opt.trim()[0];
          let cls = "opt";
          if (isMulti){
            if (sel.indexOf(letter) >= 0) cls += " selected";
            if (locked || EXAM.done){
              cls += " disabled";
              if (answerLetters(q).indexOf(letter.toUpperCase()) >= 0) cls += " right";
            }
            const handler = `toggleMulti(${si},${qi},'${letter}')`;
            return `<button class="${cls}" onclick="${handler}">${esc(opt)}</button>`;
          }
          if (answered != null){
            cls += " disabled";
            if (letter.toUpperCase() === answerLetter(q)) cls += " right";
            else if (letter === answered) cls += " wrong";
          }
          return `<button class="${cls}" onclick="answerChoice(${si},${qi},'${letter}')">${esc(opt)}</button>`;
        }).join("") + `</div>`;
        if (isMulti){
          if (!locked && !EXAM.done){
            html += `<div class="q-btns" style="margin-top:10px">
              <button class="btn btn-primary" onclick="commitMulti(${si},${qi})">✅ 确认本题（已选 ${sel.length} 项，多选）</button></div>`;
          }
          if (locked || EXAM.done){
            const right = sel.slice().sort().join("") === answerLetters(q).join("");
            html += `<div class="ans-note ${right?"right":"wrong"}">
              ${right?"✔ 回答正确":"✘ 回答错误，正确答案："+esc(q.answer)}${q.analysis?"<br>解析："+esc(q.analysis):""}</div>`;
          }
        } else if (answered != null){
          const right = (String(answered).toUpperCase() === answerLetter(q));
          html += `<div class="ans-note ${right?"right":"wrong"}">
            ${right?"✔ 回答正确":"✘ 回答错误，正确答案："+esc(q.answer)}${q.analysis?"<br>解析："+esc(q.analysis):""}</div>`;
        }
      } else if (isLetterFill){
        const val = (answered != null && answered !== true) ? answered : "";
        html += `<div class="opts" style="margin-top:10px">
          <input type="text" maxlength="1" placeholder="输入答案字母（如 B）" value="${esc(val)}"
            oninput="answerFillInput(${si},${qi},this.value)" onchange="answerFillCommit(${si},${qi})"
            ${EXAM.done?"disabled":""}
            style="padding:9px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;background:var(--card);color:var(--text);width:220px"></div>`;
        if (answered != null && answered !== true && answered !== ""){
          const right = String(answered).toUpperCase() === answerLetter(q);
          html += `<div class="ans-note ${right?"right":"wrong"}">
            ${right?"✔ 回答正确":"✘ 回答错误，正确答案："+esc(q.answer)}${q.analysis?"<br>解析："+esc(q.analysis):""}</div>`;
        }
      } else {
        const show = answered === true;
        html += `<div class="q-btns" style="margin-top:10px">
          <button class="btn ${show?"btn-ghost":"btn-primary"}" onclick="toggleEssay(${si},${qi})">${show?"🙈 收起参考答案":"👁️ 查看参考答案"}</button></div>`;
        if (show){
          html += `<div class="q-answer"><p>${esc(q.answer||"").replace(/\n/g,"<br>")}</p>
            ${q.analysis?`<div class="ex">解析：${esc(q.analysis)}</div>`:""}</div>`;
        }
      }
      html += `</div>`;
    });
  });
  const totalQ = (p.sections||[]).reduce((a,s)=>a+(s.questions||[]).length,0);
  const answeredN = Object.keys(EXAM.answers).filter(k=>{
    const v = EXAM.answers[k];
    if (Array.isArray(v)) return v.length > 0 && !!EXAM.multiLocked[k];
    return v != null && v !== "" && v !== true;
  }).length;
  html += `<div class="exam-float">
    <button class="btn btn-primary" onclick="submitPaper()">✅ 交卷查看得分（已答 ${answeredN}/${totalQ}）</button>
    <button class="btn btn-ghost" onclick="openExams()">↩ 换一套卷</button>
  </div>`;
  document.getElementById("examView").innerHTML = html;
}
function answerChoice(si, qi, letter){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  if (EXAM.answers[key] != null) return;
  EXAM.answers[key] = letter;
  renderPaper();
}
function toggleMulti(si, qi, letter){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  if (EXAM.multiLocked[key]) return;
  let sel = Array.isArray(EXAM.answers[key]) ? EXAM.answers[key].slice() : [];
  const i = sel.indexOf(letter);
  if (i >= 0) sel.splice(i, 1); else sel.push(letter);
  EXAM.answers[key] = sel;
  renderPaper();
}
function commitMulti(si, qi){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  const sel = Array.isArray(EXAM.answers[key]) ? EXAM.answers[key] : [];
  if (!sel.length) return;
  EXAM.multiLocked[key] = true;
  renderPaper();
}
function answerFillInput(si, qi, val){
  if (EXAM.done) return;
  const key = qKey(si,qi);
  EXAM.answers[key] = String(val).trim().toUpperCase() || null;
}
function answerFillCommit(si, qi){ renderPaper(); }
function toggleEssay(si, qi){
  const key = qKey(si,qi);
  EXAM.answers[key] = EXAM.answers[key] === true ? null : true;
  renderPaper();
}
function submitPaper(){
  const p = EXAM.papers[EXAM.pi];
  let qnum = 0, objTotal = 0, objRight = 0, objScore = 0, objFull = 0, subjFull = 0;
  const wrongs = [], unanswereds = [];
  (p.sections||[]).forEach((sec,si)=>{
    (sec.questions||[]).forEach((q,qi)=>{
      qnum++;
      const key = qKey(si,qi);
      const isChoice = !!(q.options && q.options.length);
      const isMulti = isChoice && isMultiQ(q);
      const isLetterFill = !isChoice && isLetterFillQ(q);
      const isObjective = isChoice || isLetterFill;
      const a = EXAM.answers[key];
      if (isObjective){
        objTotal++; objFull += (q.score||0);
        if (isMulti){
          const sel = Array.isArray(a) ? a : [];
          if (!sel.length || !EXAM.multiLocked[key]){ unanswereds.push({n:qnum,q,si,qi}); }
          else if (sel.slice().sort().join("") === answerLetters(q).join("")){ objRight++; objScore += (q.score||0); }
          else wrongs.push({n:qnum,q,si,qi});
        } else if (a == null || a === "" || a === true){ unanswereds.push({n:qnum,q,si,qi}); }
        else if (String(a).toUpperCase() === answerLetter(q)){ objRight++; objScore += (q.score||0); }
        else wrongs.push({n:qnum,q,si,qi});
      } else {
        subjFull += (q.score||0);
        if (a !== true){ unanswereds.push({n:qnum,q,si,qi}); }
      }
    });
  });
  EXAM.done = true;
  const pct = objFull ? Math.round(objScore/objFull*100) : 0;
  let html = `<div class="exam-score">
    <h2 style="color:var(--primary-dark);font-size:20px">✅ 交卷成功（${esc(p.name||"")}）</h2>
    <div style="margin:10px 0"><b class="big">${objScore}</b><span style="color:var(--muted)"> / ${objFull} 分（客观题自动判分）</span></div>
    <div class="subs">
      <div><b>${objRight}/${objTotal}</b>客观题正确</div>
      <div><b>${pct}%</b>客观题得分率</div>
      <div><b>${unanswereds.length}</b>未作答/未查看</div>
    </div>
    ${subjFull?`<p style="margin-top:12px;color:var(--muted);font-size:12.5px">主观题（写作/翻译/简答）共 ${subjFull} 分，需自行对照参考答案评分，不计入自动判分。</p>`:""}`;
  const items = (arr, title, styleCls) => arr.length ? `
    <h3 style="font-size:14px;margin-top:16px;text-align:left">${title}</h3>
    <div class="${styleCls}">${arr.map(w=>
      `<a href="javascript:void(0)" onclick="jumpToKp('${escJs(w.q.kp_id||"")}');scrollToQ(${w.si},${w.qi})">
        第${w.n}题：${esc(String(w.q.q).slice(0,42))}…${w.q.answer?("｜答案："+esc(w.q.answer)):""}</a>`).join("")}</div>` : "";
  html += items(wrongs, "❌ 答错的题目（点击回看解析）", "wrong-list");
  html += items(unanswereds, "⏳ 未作答/未查看答案的题目", "wrong-list");
  html += `<div class="q-btns" style="justify-content:center">
    <button class="btn btn-primary" onclick="startPaper(${EXAM.pi})">🔄 重做本卷</button>
    <button class="btn btn-ghost" onclick="openExams()">↩ 换一套卷</button>
    <button class="btn btn-ghost" onclick="switchView('content')">📖 回去复习</button>
  </div></div>`;
  document.getElementById("examView").innerHTML = html;
}
function scrollToQ(si, qi){
  switchView("exam");
  setTimeout(()=>{ const el = document.getElementById("q-"+si+"-"+qi);
    if (el) el.scrollIntoView({behavior:"smooth",block:"center"}); }, 80);
}

/* ================= 视图切换 ================= */
function switchView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.view===v));
  document.getElementById("contentWrap").classList.toggle("hidden", v!=="content");
  document.getElementById("graphView").classList.toggle("hidden", v!=="graph");
  document.getElementById("quizView").classList.toggle("hidden", v!=="quiz");
  document.getElementById("examView").classList.toggle("hidden", v!=="exam");
  document.getElementById("filterChips").style.display = v==="content" ? "flex" : "none";
  if (v==="graph"){
    if (!G.inited) buildGraph();
    G.alpha = Math.max(G.alpha, 0.25); startSim();
  }
  if (v==="quiz") openQuiz();
  if (v==="exam") openExams();
}

loadTheme();
applyTheme();
buildContent();
</script>
